    <script>
      /* ============================================================
   LEADERSHIP — Apply data from localStorage
   ============================================================ */
      (function () {
        "use strict";
        const LDR_STORAGE = "malka-nono-leadership";

        function loadLeadership() {
          try {
            const saved = localStorage.getItem(LDR_STORAGE);
            if (saved) return JSON.parse(saved);
          } catch (err) {
            /* ignore */
          }
          return null;
        }

        function getLang() {
          return window.i18n && window.i18n.getLang
            ? window.i18n.getLang()
            : "en";
        }

        function getName(item, prefix, lang) {
          if (!item) return "";
          return item[`${prefix}_${lang}`] || item[`${prefix}_en`] || "";
        }

        function apply() {
          const data = loadLeadership();
          if (!data) return;

          const lang = getLang();

          // ---- Top leaders ----
          (data.top || []).forEach((l) => {
            const card = document.querySelector(`[data-leader-id="${l.id}"]`);
            if (!card) return;

            const nameEl = card.querySelector("[data-leader-name]");
            const nameVal = getName(l, "name", lang);
            if (nameEl && nameVal) {
              nameEl.textContent = nameVal;
              nameEl.removeAttribute("data-i18n");
            }

            const roleEl = card.querySelector("[data-leader-role]");
            const roleVal = getName(l, "role", lang);
            if (roleEl && roleVal) {
              roleEl.textContent = roleVal;
              roleEl.removeAttribute("data-i18n");
            }

            const bioEl = card.querySelector("[data-leader-bio]");
            const bioVal = getName(l, "bio", lang);
            if (bioEl && bioVal) {
              bioEl.textContent = bioVal;
              bioEl.removeAttribute("data-i18n");
            }

            // Avatar: photo or initials
            const avatarEl = card.querySelector("[data-leader-avatar]");
            if (avatarEl) {
              const crown = avatarEl.querySelector(".crown");
              const crownHTML = crown ? '<span class="crown">👑</span>' : "";
              if (l.photo) {
                avatarEl.innerHTML = `<img src="${l.photo}" alt="${nameVal || ""}" style="width:100%;height:100%;object-fit:cover;border-radius:50%;" />${crownHTML}`;
              } else if (l.initials) {
                avatarEl.textContent = l.initials;
                if (crownHTML)
                  avatarEl.insertAdjacentHTML("beforeend", crownHTML);
              }
            }
          });

          // ---- Sectors ----
          (data.sectors || []).forEach((s) => {
            const card = document.querySelector(`[data-sector-id="${s.id}"]`);
            if (!card) return;

            const h3 = card.querySelector("h3");
            const sectorName = getName(s, "name", lang);
            if (h3 && sectorName) {
              h3.textContent = sectorName;
              h3.removeAttribute("data-i18n");
            }

            const leadEl = card.querySelector("[data-sector-lead]");
            const leadVal = getName(s, "lead", lang);
            if (leadEl && leadVal) {
              leadEl.textContent = leadVal;
              leadEl.removeAttribute("data-i18n");
            }

            const iconEl = card.querySelector("[data-sector-icon]");
            if (iconEl && s.icon) iconEl.textContent = s.icon;
          });

          console.log("[Leadership] ✓ Applied data");
        }

        // Apply on load
        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", () =>
            setTimeout(apply, 300),
          );
        } else {
          setTimeout(apply, 300);
        }

        // Re-apply on language change
        window.addEventListener("langchange", () => setTimeout(apply, 150));

        // Re-apply when tab regains focus
        window.addEventListener("focus", () => setTimeout(apply, 250));
      })();
    </script>
