      /* ============================================================
   1) LEADERSHIP — Apply data from localStorage
   ============================================================ */
      (function () {
        "use strict";
        const LDR_STORAGE = "malka-nono-leadership";

        function loadLeadership() {
          try {
            const saved = localStorage.getItem(LDR_STORAGE);
            if (saved) return JSON.parse(saved);
          } catch (err) {
            /* ignore */
          }
          return null;
        }

        function getLang() {
          return window.i18n && window.i18n.getLang
            ? window.i18n.getLang()
            : "en";
        }

        function getName(item, prefix, lang) {
          if (!item) return "";
          return item[`${prefix}_${lang}`] || item[`${prefix}_en`] || "";
        }

        function apply() {
          const data = loadLeadership();
          if (!data) return;
          const lang = getLang();

          (data.top || []).forEach((l) => {
            const card = document.querySelector(`[data-leader-id="${l.id}"]`);
            if (!card) return;

            const nameEl = card.querySelector("[data-leader-name]");
            const nameVal = getName(l, "name", lang);
            if (nameEl && nameVal) {
              nameEl.textContent = nameVal;
              nameEl.removeAttribute("data-i18n");
            }

            const roleEl = card.querySelector("[data-leader-role]");
            const roleVal = getName(l, "role", lang);
            if (roleEl && roleVal) {
              roleEl.textContent = roleVal;
              roleEl.removeAttribute("data-i18n");
            }

            const bioEl = card.querySelector("[data-leader-bio]");
            const bioVal = getName(l, "bio", lang);
            if (bioEl && bioVal) {
              bioEl.textContent = bioVal;
              bioEl.removeAttribute("data-i18n");
            }

            const avatarEl = card.querySelector("[data-leader-avatar]");
            if (avatarEl) {
              const crown = avatarEl.querySelector(".crown");
              const crownHTML = crown ? '<span class="crown">👑</span>' : "";
              if (l.photo) {
                avatarEl.innerHTML = `<img src="${l.photo}" alt="${nameVal || ""}" style="width:100%;height:100%;object-fit:cover;border-radius:50%;" />${crownHTML}`;
              } else if (l.initials) {
                avatarEl.innerHTML = `${l.initials}${crownHTML}`;
              }
            }
          });

          (data.sectors || []).forEach((s) => {
            const card = document.querySelector(`[data-sector-id="${s.id}"]`);
            if (!card) return;
            const h3 = card.querySelector("h3");
            const sectorName = getName(s, "name", lang);
            if (h3 && sectorName) {
              h3.textContent = sectorName;
              h3.removeAttribute("data-i18n");
            }

            const leadEl = card.querySelector("[data-sector-lead]");
            const leadVal = getName(s, "lead", lang);
            if (leadEl && leadVal) {
              leadEl.textContent = leadVal;
              leadEl.removeAttribute("data-i18n");
            }

            const iconEl = card.querySelector("[data-sector-icon]");
            if (iconEl && s.icon) iconEl.textContent = s.icon;
          });
        }

        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", () =>
            setTimeout(apply, 300),
          );
        } else {
          setTimeout(apply, 300);
        }
        window.addEventListener("langchange", () => setTimeout(apply, 150));
      })();

              am: "በነፃነት ሂደቱን ይከታተላል።",
              om: "Bilisummaadhaan adeemsa hordofa.",

        let COMMITTEES = FALLBACK.slice();

        function getLang() {
          return window.i18n && window.i18n.getLang
            ? window.i18n.getLang()
            : "en";
        }

        function escapeHtml(s) {
          if (s === null || s === undefined) return "";
          return String(s).replace(
            /[&<>"']/g,
            (c) =>
              ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#39;",
              })[c],
          );
        }

        function t(key) {
          return window.i18n && window.i18n.t ? window.i18n.t(key) : key;
        }

        function initialsOf(name) {
          if (!name) return "??";
          return name
            .split(" ")
            .map((s) => s[0])
            .join("")
            .slice(0, 2)
            .toUpperCase();
        }

        function getI18n(item, field) {
          const lang = getLang();
          // item.sub.title/desc can be either i18n keys (from Supabase it's a plain object)
          if (item[field] && typeof item[field] === "object") {
            return item[field][lang] || item[field].en || "";
          }
          // Supabase format: sub_en, sub_am etc.
          if (item[`${field}_${lang}`]) return item[`${field}_${lang}`];
          if (item[`${field}_en`]) return item[`${field}_en`];
          return "";
        }

        function normalizeFromSupabase(c) {
          let members = [];
          try {
            members =
              typeof c.members === "string"
                ? JSON.parse(c.members)
                : c.members || [];
          } catch (e) {
            members = [];
          }

          return {
            id: c.id,
            committee_key: c.committee_key,
            icon: c.icon,
            sub: { en: c.sub_en, am: c.sub_am, om: c.sub_om, ar: c.sub_ar },
            title: {
              en: c.title_en,
              am: c.title_am,
              om: c.title_om,
              ar: c.title_ar,
            },
            desc: {
              en: c.desc_en,
              am: c.desc_am,
              om: c.desc_om,
              ar: c.desc_ar,
            },
            leader: {
              name: c.leader_name || "",
              role: c.leader_role || "",
              initials: c.leader_initials || initialsOf(c.leader_name || ""),
              photo: c.leader_photo || "",
            },
            members: members,
          };
        }

        function render() {
          const grid = document.getElementById("projectCommitteesGrid");
          if (!grid) return;

          grid.innerHTML = COMMITTEES.map(
            (c) => `
      <div class="committee-card reveal visible" data-committee="${escapeHtml(c.committee_key)}">
        <div class="cc-head">
          <div class="cc-icon">${c.icon || "📋"}</div>
          <div>
            <div class="cc-sub">${escapeHtml(getI18n(c, "sub"))}</div>
            <h3>${escapeHtml(getI18n(c, "title"))}</h3>
          </div>
        </div>
        <p>${escapeHtml(getI18n(c, "desc"))}</p>
        <button class="cc-view-members" type="button">
          <span data-i18n="leadership.committee.viewMembers"></span>
          <span class="arrow">→</span>
        </button>
      </div>
    `,
          ).join("");

          if (window.i18n && window.i18n.applyTranslations) {
            window.i18n.applyTranslations();
          }

          bindCardClicks();
        }

        function bindCardClicks() {
          document.querySelectorAll("[data-committee]").forEach((card) => {
            const key = card.dataset.committee;

            // Whole card clickable
            card.addEventListener("click", (e) => {
              if (e.target.closest("a")) return;
              openModal(key);
            });

            // Button clickable (stops propagation to avoid double)
            const btn = card.querySelector(".cc-view-members");
            if (btn) {
              btn.addEventListener("click", (e) => {
                e.stopPropagation();
                openModal(key);
              });
            }
          });
        }

        /* ============================================================
     MEMBERS MODAL
     ============================================================ */
        const modal = document.getElementById("membersModal");
        const mmIcon = document.getElementById("mmIcon");
        const mmSub = document.getElementById("mmSub");
        const mmTitle = document.getElementById("mmTitle");
        const mmLeader = document.getElementById("mmLeader");
        const mmMembers = document.getElementById("mmMembers");

        function openModal(key) {
          const data = COMMITTEES.find((c) => c.committee_key === key);
          if (!data || !modal) return;

          mmIcon.textContent = data.icon || "📋";
          mmSub.textContent = getI18n(data, "sub");
          mmTitle.textContent = getI18n(data, "title");

          const leader = data.leader || {};
          mmLeader.innerHTML = `
      <div class="mm-avatar">${leader.photo ? `<img src="${escapeHtml(leader.photo)}" alt="" />` : leader.initials || initialsOf(leader.name)}</div>
      <div>
        <div class="mm-name">${escapeHtml(leader.name || "—")}</div>
        <div class="mm-role">${escapeHtml(leader.role || "Chair")}</div>
      </div>
    `;

          mmMembers.innerHTML = (data.members || [])
            .map(
              (m) => `
      <div class="mm-member">
        <div class="mm-avatar">${m.photo ? `<img src="${escapeHtml(m.photo)}" alt="" />` : m.initials || initialsOf(m.name)}</div>
        <div>
          <div class="mm-name">${escapeHtml(m.name)}</div>
          ${m.role ? `<div class="mm-role">${escapeHtml(m.role)}</div>` : ""}
        </div>
      </div>
    `,
            )
            .join("");

          modal.classList.add("show");
          modal.setAttribute("aria-hidden", "false");
          document.body.style.overflow = "hidden";
        }

        function closeModal() {
          if (!modal) return;
          modal.classList.remove("show");
          modal.setAttribute("aria-hidden", "true");
          document.body.style.overflow = "";
        }

        document.querySelectorAll("[data-close-members]").forEach((el) => {
          el.addEventListener("click", closeModal);
        });

        document.addEventListener("keydown", (e) => {
          if (e.key === "Escape") closeModal();
        });

        /* ============================================================
     INIT — Try Supabase first, fallback to local
     ============================================================ */
        async function loadFromSupabase() {
          if (!window.mknBackend || !window.mknBackend.fetchCommittees) return;
          try {
            const res = await window.mknBackend.fetchCommittees({
              status: "published",
            });
            if (res.success && res.data && res.data.length > 0) {
              COMMITTEES = res.data.map(normalizeFromSupabase);
              render();
              console.log(
                "[Committees] ✓ Loaded from Supabase:",
                COMMITTEES.length,
              );
              return;
            }
          } catch (err) {
            console.warn("[Committees] Supabase load failed:", err);
          }
          console.log("[Committees] Using fallback data");
        }

        function init() {
          // Render fallback immediately (fast)
          render();

          // Then try Supabase
          if (document.readyState === "loading") {
            document.addEventListener("DOMContentLoaded", () =>
              setTimeout(loadFromSupabase, 500),
            );
          } else {
            setTimeout(loadFromSupabase, 500);
          }
        }

        // Re-render on language change
        window.addEventListener("langchange", () => setTimeout(render, 150));

        init();
      })();
    </script>
  </body>
