<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Donate — Malka Nono Project</title>
    <meta
      name="description"
      content="Support the Malka Nono Islamic Affairs Council project. Every contribution builds a permanent institution."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Ethiopic:wght@300;400;500;600;700;800&family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div id="site-nav"></div>

    <!-- ============ PAGE HERO ============ -->
    <header class="page-hero">
      <div class="container">
        <span class="page-tag" data-i18n="donate.hero.tag"></span>
        <h1 data-i18n="donate.hero.title"></h1>
        <p data-i18n="donate.hero.lede"></p>
        <div class="breadcrumb">
          <a href="index.html" data-i18n="nav.home"></a>
          <span>/</span>
          <span data-i18n="nav.donate"></span>
        </div>
      </div>
    </header>

    <!-- ============ WHY DONATE ============ -->
    <section>
      <div class="container">
        <div class="section-head reveal">
          <span class="section-tag" data-i18n="donate.why.tag"></span>
          <h2 data-i18n="donate.why.title"></h2>
          <p data-i18n="donate.why.lede"></p>
        </div>

        <div class="grid grid-3">
          <div class="card reveal">
            <div class="card-icon">🏛️</div>
            <h3 data-i18n="donate.why.c1.title"></h3>
            <p data-i18n="donate.why.c1.desc"></p>
          </div>
          <div class="card reveal">
            <div class="card-icon">♾️</div>
            <h3 data-i18n="donate.why.c2.title"></h3>
            <p data-i18n="donate.why.c2.desc"></p>
          </div>
          <div class="card reveal">
            <div class="card-icon">🤲</div>
            <h3 data-i18n="donate.why.c3.title"></h3>
            <p data-i18n="donate.why.c3.desc"></p>
          </div>
        </div>

        <div class="trust-badges reveal">
          <div class="trust-badge">
            <div class="icon">🔒</div>
            <div class="text">
              <span data-i18n="donate.trust.t1"></span>
              <small data-i18n="donate.trust.t1s"></small>
            </div>
          </div>
          <div class="trust-badge">
            <div class="icon">📋</div>
            <div class="text">
              <span data-i18n="donate.trust.t2"></span>
              <small data-i18n="donate.trust.t2s"></small>
            </div>
          </div>
          <div class="trust-badge">
            <div class="icon">👁️</div>
            <div class="text">
              <span data-i18n="donate.trust.t3"></span>
              <small data-i18n="donate.trust.t3s"></small>
            </div>
          </div>
          <div class="trust-badge">
            <div class="icon">🕌</div>
            <div class="text">
              <span data-i18n="donate.trust.t4"></span>
              <small data-i18n="donate.trust.t4s"></small>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- ============ BANK ACCOUNTS ============ -->
    <section style="background: var(--g50)">
      <div class="container">
        <div class="section-head reveal">
          <span class="section-tag" data-i18n="donate.bank.tag"></span>
          <h2 data-i18n="donate.bank.title"></h2>
          <p data-i18n="donate.bank.lede"></p>
        </div>

        <div class="bank-grid">
          <!-- CBE -->
          <div class="bank-card reveal">
            <div class="bank-head">
              <div class="bank-logo cbe">CBE</div>
              <div class="bank-name">
                <span data-i18n="donate.bank.cbe"></span>
                <small data-i18n="donate.bank.cbe.sub"></small>
              </div>
            </div>
            <div class="bank-row">
              <span class="label" data-i18n="donate.bank.accountName"></span>
              <span
                class="value"
                data-i18n="donate.bank.accountName.value"
              ></span>
            </div>
            <div class="bank-row">
              <span class="label" data-i18n="donate.bank.accountNo"></span>
              <span class="value" data-i18n="donate.bank.cbe.no"></span>
            </div>
            <button class="copy-btn" data-copy="1000123456789">
              📋 <span data-i18n="donate.copy"></span>
            </button>
          </div>

          <!-- Awash -->
          <div class="bank-card reveal">
            <div class="bank-head">
              <div class="bank-logo awash">AW</div>
              <div class="bank-name">
                <span data-i18n="donate.bank.awash"></span>
                <small data-i18n="donate.bank.awash.sub"></small>
              </div>
            </div>
            <div class="bank-row">
              <span class="label" data-i18n="donate.bank.accountName"></span>
              <span
                class="value"
                data-i18n="donate.bank.accountName.value"
              ></span>
            </div>
            <div class="bank-row">
              <span class="label" data-i18n="donate.bank.accountNo"></span>
              <span class="value" data-i18n="donate.bank.awash.no"></span>
            </div>
            <button class="copy-btn" data-copy="0132012345678">
              📋 <span data-i18n="donate.copy"></span>
            </button>
          </div>

          <!-- Dashen -->
          <div class="bank-card reveal">
            <div class="bank-head">
              <div class="bank-logo dashen">DB</div>
              <div class="bank-name">
                <span data-i18n="donate.bank.dashen"></span>
                <small data-i18n="donate.bank.dashen.sub"></small>
              </div>
            </div>
            <div class="bank-row">
              <span class="label" data-i18n="donate.bank.accountName"></span>
              <span
                class="value"
                data-i18n="donate.bank.accountName.value"
              ></span>
            </div>
            <div class="bank-row">
              <span class="label" data-i18n="donate.bank.accountNo"></span>
              <span class="value" data-i18n="donate.bank.dashen.no"></span>
            </div>
            <button class="copy-btn" data-copy="0057012345678">
              📋 <span data-i18n="donate.copy"></span>
            </button>
          </div>
        </div>

        <!-- Mobile Money -->
        <div style="margin-top: 50px">
          <div class="section-head reveal">
            <span class="section-tag" data-i18n="donate.mobile.tag"></span>
            <h2 data-i18n="donate.mobile.title"></h2>
          </div>
          <div class="bank-grid">
            <div class="bank-card reveal">
              <div class="bank-head">
                <div class="bank-logo telebirr">TB</div>
                <div class="bank-name">
                  <span data-i18n="donate.mobile.telebirr"></span>
                  <small data-i18n="donate.mobile.telebirr.sub"></small>
                </div>
              </div>
              <div class="bank-row">
                <span class="label" data-i18n="donate.mobile.number"></span>
                <span class="value">+251 91 123 4567</span>
              </div>
              <button class="copy-btn" data-copy="+251911234567">
                📋 <span data-i18n="donate.copy"></span>
              </button>
            </div>
            <div class="bank-card reveal">
              <div class="bank-head">
                <div class="bank-logo cbe-birr">CB</div>
                <div class="bank-name">
                  <span data-i18n="donate.mobile.cbebirr"></span>
                  <small data-i18n="donate.mobile.cbebirr.sub"></small>
                </div>
              </div>
              <div class="bank-row">
                <span class="label" data-i18n="donate.mobile.number"></span>
                <span class="value">+251 91 765 4321</span>
              </div>
              <button class="copy-btn" data-copy="+251917654321">
                📋 <span data-i18n="donate.copy"></span>
              </button>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- ============ ONLINE PLEDGE FORM ============ -->
    <section>
      <div class="container" style="max-width: 820px">
        <div class="section-head reveal">
          <span class="section-tag" data-i18n="donate.pledge.tag"></span>
          <h2 data-i18n="donate.pledge.title"></h2>
          <p data-i18n="donate.pledge.lede"></p>
        </div>

        <div class="table-wrap reveal" style="padding: 36px 32px">
          <form id="pledgeForm" novalidate>
            <div class="form-grid">
              <div class="form-group">
                <label
                  class="form-label"
                  for="pName"
                  data-i18n="common.name"
                ></label>
                <input class="form-input" type="text" id="pName" required />
              </div>
              <div class="form-group">
                <label
                  class="form-label"
                  for="pPhone"
                  data-i18n="common.phone"
                ></label>
                <input class="form-input" type="tel" id="pPhone" required />
              </div>
              <div class="form-group full">
                <label
                  class="form-label"
                  for="pEmail"
                  data-i18n="common.email"
                ></label>
                <input class="form-input" type="email" id="pEmail" />
              </div>

              <div class="form-group full">
                <label
                  class="form-label"
                  data-i18n="donate.pledge.amount"
                ></label>
                <div class="amount-options">
                  <button
                    type="button"
                    class="amount-option"
                    data-amount="1000"
                  >
                    1,000<small data-i18n="unit.etb"></small>
                  </button>
                  <button
                    type="button"
                    class="amount-option"
                    data-amount="5000"
                  >
                    5,000<small data-i18n="unit.etb"></small>
                  </button>
                  <button
                    type="button"
                    class="amount-option"
                    data-amount="10000"
                  >
                    10,000<small data-i18n="unit.etb"></small>
                  </button>
                  <button
                    type="button"
                    class="amount-option"
                    data-amount="50000"
                  >
                    50,000<small data-i18n="unit.etb"></small>
                  </button>
                  <button
                    type="button"
                    class="amount-option"
                    data-amount="100000"
                  >
                    100,000<small data-i18n="unit.etb"></small>
                  </button>
                  <button
                    type="button"
                    class="amount-option"
                    data-amount="custom"
                    data-i18n="donate.pledge.custom"
                  ></button>
                </div>
                <input
                  class="form-input"
                  type="number"
                  id="pAmount"
                  min="1"
                  placeholder="Custom amount (ETB)"
                  style="display: none"
                />
              </div>

              <div class="form-group full">
                <label
                  class="form-label"
                  for="pMethod"
                  data-i18n="donate.pledge.method"
                ></label>
                <select class="form-select" id="pMethod">
                  <option data-i18n="donate.bank.cbe"></option>
                  <option data-i18n="donate.bank.awash"></option>
                  <option data-i18n="donate.bank.dashen"></option>
                  <option data-i18n="donate.mobile.telebirr"></option>
                  <option data-i18n="donate.mobile.cbebirr"></option>
                  <option data-i18n="donate.pledge.other"></option>
                </select>
              </div>

              <div class="form-group full">
                <label
                  class="form-label"
                  for="pNote"
                  data-i18n="donate.pledge.note"
                ></label>
                <textarea class="form-textarea" id="pNote" rows="3"></textarea>
              </div>

              <div class="form-group full">
                <button
                  type="submit"
                  class="btn btn-primary"
                  style="width: 100%; justify-content: center"
                  data-i18n="donate.pledge.submit"
                ></button>
              </div>
            </div>

            <div
              class="form-success"
              id="pledgeSuccess"
              data-i18n="donate.pledge.success"
            ></div>
          </form>
        </div>
      </div>
    </section>

    <!-- ============ CTA ============ -->
    <section style="padding-top: 0">
      <div class="cta-banner reveal">
        <h2 data-i18n="cta.title"></h2>
        <p data-i18n="cta.desc"></p>
        <a
          href="reports.html"
          class="btn btn-gold"
          data-i18n="donate.cta.reports"
        ></a>
      </div>
    </section>

    <div id="site-footer"></div>

    <script src="js/translations.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/main.js"></script>
    <script>
      // Copy to clipboard
      document.addEventListener("click", (e) => {
        const btn = e.target.closest(".copy-btn");
        if (!btn) return;
        const text = btn.dataset.copy;
        navigator.clipboard.writeText(text).then(() => {
          const original = btn.innerHTML;
          btn.classList.add("copied");
          btn.innerHTML =
            "✓ " + (window.i18n ? window.i18n.t("donate.copied") : "Copied!");
          setTimeout(() => {
            btn.classList.remove("copied");
            btn.innerHTML = original;
          }, 1800);
        });
      });

      // Amount selection
      document.querySelectorAll(".amount-option").forEach((btn) => {
        btn.addEventListener("click", () => {
          document
            .querySelectorAll(".amount-option")
            .forEach((b) => b.classList.remove("selected"));
          btn.classList.add("selected");
          const amountInput = document.getElementById("pAmount");
          const label = document.querySelector(
            'label[data-i18n="donate.pledge.amount"]',
          );
          if (btn.dataset.amount === "custom") {
            amountInput.style.display = "block";
            amountInput.value = "";
            amountInput.focus();
            amountInput.placeholder = window.i18n
              ? window.i18n.t("donate.pledge.customPlaceholder")
              : "Enter custom amount (ETB)";
          } else {
            amountInput.style.display = "none";
            amountInput.value = btn.dataset.amount;
          }
        });
      });

      // Form submit
      const pledgeForm = document.getElementById("pledgeForm");
      if (pledgeForm) {
        pledgeForm.addEventListener("submit", (e) => {
          e.preventDefault();
          const success = document.getElementById("pledgeSuccess");
          success.classList.add("show");
          pledgeForm.reset();
          document
            .querySelectorAll(".amount-option")
            .forEach((b) => b.classList.remove("selected"));
          document.getElementById("pAmount").style.display = "none";
          setTimeout(() => success.classList.remove("show"), 5000);
        });
      }
    </script>
  </body>
</html>
