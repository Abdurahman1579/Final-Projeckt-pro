<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fundraising — Malka Nono Project</title>
    <meta name="description" content="Fundraising plan — 4 tiers, one goal." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Ethiopic:wght@300;400;500;600;700;800&family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div id="site-nav"></div>

    <header class="page-hero">
      <div class="container">
        <span class="page-tag" data-i18n="fund.hero.tag"></span>
        <h1 data-i18n="fund.hero.title"></h1>
        <p data-i18n="fund.hero.lede"></p>
        <div class="breadcrumb">
          <a href="index.html" data-i18n="nav.home"></a>
          <span>/</span>
          <span data-i18n="nav.fundraising"></span>
        </div>
      </div>
    </header>

    <!-- ============ PRINCIPLE ============ -->
    <section>
      <div class="container">
        <div class="callout reveal" style="text-align: center; font-size: 17px">
          <strong data-i18n="fund.principle.title"></strong><br />
          <span data-i18n="fund.principle.text"></span>
        </div>

        <div class="section-head reveal" style="margin-top: 50px">
          <span class="section-tag" data-i18n="fund.tag"></span>
          <h2 data-i18n="fund.title"></h2>
          <p data-i18n="fund.lede"></p>
        </div>

        <div class="tiers">
          <div class="tier reveal">
            <span class="tier-badge" data-i18n="fund.tier1.badge"></span>
            <h3 data-i18n="fund.tier1.title"></h3>
            <div class="goal">80,000,000 ብር</div>
            <p data-i18n="fund.tier1.desc"></p>
          </div>
          <div class="tier reveal">
            <span class="tier-badge" data-i18n="fund.tier2.badge"></span>
            <h3 data-i18n="fund.tier2.title"></h3>
            <div class="goal">45,000,000 ብር</div>
            <p data-i18n="fund.tier2.desc"></p>
          </div>
          <div class="tier reveal">
            <span class="tier-badge" data-i18n="fund.tier3.badge"></span>
            <h3 data-i18n="fund.tier3.title"></h3>
            <div class="goal">30,000,000 ብር</div>
            <p data-i18n="fund.tier3.desc"></p>
          </div>
          <div class="tier reveal">
            <span class="tier-badge" data-i18n="fund.tier4.badge"></span>
            <h3 data-i18n="fund.tier4.title"></h3>
            <div class="goal">20,000,000 ብር</div>
            <p data-i18n="fund.tier4.desc"></p>
          </div>
        </div>
      </div>
    </section>

    <!-- ============ MATRIX TABLE ============ -->
    <section style="background: var(--g50)">
      <div class="container">
        <div class="section-head reveal">
          <span class="section-tag" data-i18n="fund.matrix.tag"></span>
          <h2 data-i18n="fund.matrix.title"></h2>
          <p data-i18n="fund.matrix.lede"></p>
        </div>
        <div class="table-wrap reveal">
          <table>
            <thead>
              <tr>
                <th data-i18n="budget.th.no"></th>
                <th data-i18n="fund.matrix.th.source"></th>
                <th class="num" data-i18n="fund.matrix.th.goal"></th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td>1</td>
                <td data-i18n="fund.tier1.title"></td>
                <td class="num">80,000,000 ብር</td>
              </tr>
              <tr>
                <td>2</td>
                <td data-i18n="fund.tier2.title"></td>
                <td class="num">45,000,000 ብር</td>
              </tr>
              <tr>
                <td>3</td>
                <td data-i18n="fund.tier3.title"></td>
                <td class="num">30,000,000 ብር</td>
              </tr>
              <tr>
                <td>4</td>
                <td data-i18n="fund.tier4.title"></td>
                <td class="num">20,000,000 ብር</td>
              </tr>
              <tr>
                <td>5</td>
                <td data-i18n="fund.matrix.businesses"></td>
                <td class="num">15,000,000 ብር</td>
              </tr>
              <tr class="total">
                <td colspan="2" data-i18n="budget.total"></td>
                <td class="num">190,000,000 ብር</td>
              </tr>
            </tbody>
          </table>
        </div>
        <p
          style="
            text-align: center;
            color: var(--ink500);
            font-size: 13.5px;
            margin-top: 18px;
            max-width: 720px;
            margin-inline: auto;
          "
          class="reveal"
          data-i18n="fund.matrix.note"
        ></p>
      </div>
    </section>

    <!-- ============ DETAILED TIER DESCRIPTIONS ============ -->
    <section>
      <div class="container">
        <div class="section-head reveal">
          <span class="section-tag" data-i18n="fund.detail.tag"></span>
          <h2 data-i18n="fund.detail.title"></h2>
        </div>

        <div class="info-block reveal">
          <div>
            <h3 data-i18n="fund.tier1.title"></h3>
            <p data-i18n="fund.tier1.long1"></p>
            <p data-i18n="fund.tier1.long2"></p>
            <p data-i18n="fund.tier1.long3"></p>
          </div>
          <div class="info-visual">💎</div>
        </div>

        <div class="info-block reveal">
          <div class="info-visual">🤝</div>
          <div>
            <h3 data-i18n="fund.tier2.title"></h3>
            <p data-i18n="fund.tier2.long1"></p>
            <p data-i18n="fund.tier2.long2"></p>
          </div>
        </div>

        <div class="info-block reveal">
          <div>
            <h3 data-i18n="fund.tier3.title"></h3>
            <p data-i18n="fund.tier3.long1"></p>
            <p data-i18n="fund.tier3.long2"></p>
          </div>
          <div class="info-visual">👥</div>
        </div>

        <div class="info-block reveal">
          <div class="info-visual">🕌</div>
          <div>
            <h3 data-i18n="fund.tier4.title"></h3>
            <p data-i18n="fund.tier4.long1"></p>
            <p data-i18n="fund.tier4.long2"></p>
          </div>
        </div>
      </div>
    </section>

    <!-- ============ PROCESS ============ -->
    <section style="background: var(--g50)">
      <div class="container">
        <div class="section-head reveal">
          <span class="section-tag" data-i18n="fund.process.tag"></span>
          <h2 data-i18n="fund.process.title"></h2>
          <p data-i18n="fund.process.lede"></p>
        </div>
        <div class="process reveal">
          <div class="process-item">
            <span class="pt" data-i18n="fund.process.p1"></span>
          </div>
          <div class="process-item">
            <span class="pt" data-i18n="fund.process.p2"></span>
          </div>
          <div class="process-item">
            <span class="pt" data-i18n="fund.process.p3"></span>
          </div>
          <div class="process-item">
            <span class="pt" data-i18n="fund.process.p4"></span>
          </div>
          <div class="process-item">
            <span class="pt" data-i18n="fund.process.p5"></span>
          </div>
          <div class="process-item">
            <span class="pt" data-i18n="fund.process.p6"></span>
          </div>
          <div class="process-item">
            <span class="pt" data-i18n="fund.process.p7"></span>
          </div>
          <div class="process-item">
            <span class="pt" data-i18n="fund.process.p8"></span>
          </div>
        </div>
      </div>
    </section>

    <!-- ============ TRANSPARENCY ============ -->
    <section>
      <div class="container">
        <div class="section-head reveal">
          <span class="section-tag" data-i18n="fund.transparency.tag"></span>
          <h2 data-i18n="fund.transparency.title"></h2>
          <p data-i18n="fund.transparency.lede"></p>
        </div>
        <div class="grid grid-3">
          <div class="card reveal">
            <div class="card-icon">📋</div>
            <h3 data-i18n="fund.transparency.t1.title"></h3>
            <p data-i18n="fund.transparency.t1.desc"></p>
          </div>
          <div class="card reveal">
            <div class="card-icon">🔍</div>
            <h3 data-i18n="fund.transparency.t2.title"></h3>
            <p data-i18n="fund.transparency.t2.desc"></p>
          </div>
          <div class="card reveal">
            <div class="card-icon">📢</div>
            <h3 data-i18n="fund.transparency.t3.title"></h3>
            <p data-i18n="fund.transparency.t3.desc"></p>
          </div>
        </div>
      </div>
    </section>

    <!-- ============ CTA ============ -->
    <section style="padding-top: 0">
      <div class="cta-banner reveal">
        <h2 data-i18n="cta.title"></h2>
        <p data-i18n="cta.desc"></p>
        <a href="donate.html" class="btn btn-gold" data-i18n="cta.btn"></a>
      </div>
    </section>

    <div id="site-footer"></div>

    <script src="js/translations.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
