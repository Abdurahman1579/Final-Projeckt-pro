<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reports — Malka Nono Project</title>
    <meta
      name="description"
      content="Financial, progress, and audit reports for the Malka Nono project."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Ethiopic:wght@300;400;500;600;700;800&family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div id="site-nav"></div>

    <!-- ============ PAGE HERO ============ -->
    <header class="page-hero">
      <div class="container">
        <span class="page-tag" data-i18n="reports.hero.tag"></span>
        <h1 data-i18n="reports.hero.title"></h1>
        <p data-i18n="reports.hero.lede"></p>
        <div class="breadcrumb">
          <a href="index.html" data-i18n="nav.home"></a>
          <span>/</span>
          <span data-i18n="nav.reports"></span>
        </div>
      </div>
    </header>

    <!-- ============ REPORT STATS ============ -->
    <section>
      <div class="container">
        <div class="section-head reveal">
          <span class="section-tag" data-i18n="reports.stats.tag"></span>
          <h2 data-i18n="reports.stats.title"></h2>
        </div>

        <div class="report-stats">
          <div class="report-stat reveal">
            <div class="rs-icon">📊</div>
            <div class="rs-num">
              <span class="counter" data-target="190" data-start="0">0</span
              ><small data-i18n="unit.million"></small>
            </div>
            <div class="rs-lbl" data-i18n="reports.stat.total"></div>
          </div>
          <div class="report-stat reveal">
            <div class="rs-icon">💰</div>
            <div class="rs-num">
              <span
                class="counter"
                id="statRaised"
                data-target="0"
                data-start="0"
                >0</span
              ><small> ብር</small>
            </div>
            <div class="rs-lbl" data-i18n="reports.stat.raised"></div>
          </div>
          <div class="report-stat reveal">
            <div class="rs-icon">📈</div>
            <div class="rs-num">
              <span
                class="counter"
                id="statProgress"
                data-target="0"
                data-decimals="1"
                data-start="0"
                >0</span
              ><small>%</small>
            </div>
            <div class="rs-lbl" data-i18n="reports.stat.progress"></div>
          </div>
          <div class="report-stat reveal">
            <div class="rs-icon">🧾</div>
            <div class="rs-num">
              <span
                class="counter"
                id="statPublished"
                data-target="0"
                data-start="0"
                >0</span
              >
            </div>
            <div class="rs-lbl" data-i18n="reports.stat.published"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- ============ REPORT LIST ============ -->
    <section style="background: var(--g50)">
      <div class="container">
        <div class="section-head reveal">
          <span class="section-tag" data-i18n="reports.list.tag"></span>
          <h2 data-i18n="reports.list.title"></h2>
          <p data-i18n="reports.list.lede"></p>
        </div>

        <div
          id="reportsLoading"
          style="text-align: center; padding: 40px 0; color: var(--ink500)"
        >
          <div style="font-size: 40px; margin-bottom: 10px">⏳</div>
          <p>Loading reports...</p>
        </div>

        <div class="reports-grid" id="reportsGrid"></div>

        <div class="empty-state" id="reportsEmpty" style="display: none">
          <div class="icon">📭</div>
          <h3 data-i18n="reports.empty.title"></h3>
          <p data-i18n="reports.empty.desc"></p>
        </div>
      </div>
    </section>

    <!-- ============ TRANSPARENCY COMMITMENT ============ -->
    <section>
      <div class="container">
        <div class="section-head reveal">
          <span class="section-tag" data-i18n="reports.transparency.tag"></span>
          <h2 data-i18n="reports.transparency.title"></h2>
          <p data-i18n="reports.transparency.lede"></p>
        </div>
        <div class="grid grid-3">
          <div class="card reveal">
            <div class="card-icon">📅</div>
            <h3 data-i18n="reports.commit.c1.title"></h3>
            <p data-i18n="reports.commit.c1.desc"></p>
          </div>
          <div class="card reveal">
            <div class="card-icon">🔍</div>
            <h3 data-i18n="reports.commit.c2.title"></h3>
            <p data-i18n="reports.commit.c2.desc"></p>
          </div>
          <div class="card reveal">
            <div class="card-icon">📢</div>
            <h3 data-i18n="reports.commit.c3.title"></h3>
            <p data-i18n="reports.commit.c3.desc"></p>
          </div>
        </div>
      </div>
    </section>

    <!-- ============ CTA ============ -->
    <section style="padding-top: 0">
      <div class="cta-banner reveal">
        <h2 data-i18n="reports.cta.title"></h2>
        <p data-i18n="reports.cta.desc"></p>
        <a href="donate.html" class="btn btn-gold" data-i18n="cta.btn"></a>
      </div>
    </section>

    <div id="site-footer"></div>

    <!-- ============ SCRIPTS ============ -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/translations.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/main.js"></script>
    <script src="js/supabase.js"></script>
    <script src="js/counter.js"></script>
    <script>
      /* ============================================================
     REPORTS PAGE — Load from Supabase
     ============================================================ */

      function formatDate(iso) {
        if (!iso) return "";
        try {
          const d = new Date(iso);
          const months = [
            "Jan",
            "Feb",
            "Mar",
            "Apr",
            "May",
            "Jun",
            "Jul",
            "Aug",
            "Sep",
            "Oct",
            "Nov",
            "Dec",
          ];
          return (
            months[d.getMonth()] + " " + d.getDate() + ", " + d.getFullYear()
          );
        } catch (e) {
          return "";
        }
      }

      function formatSize(bytes) {
        if (!bytes) return "—";
        const k = 1024;
        const sizes = ["B", "KB", "MB", "GB"];
        const i = Math.floor(Math.log(bytes) / Math.log(k));
        return (
          (bytes / Math.pow(k, i)).toFixed(i === 0 ? 0 : 2) + " " + sizes[i]
        );
      }

      function escapeHtml(s) {
        if (s === null || s === undefined) return "";
        return String(s).replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      }

      function typeIcon(type) {
        const map = {
          financial: "💰",
          progress: "📊",
          audit: "🔍",
          quarterly: "📆",
        };
        return map[type] || "📄";
      }

      function typeClass(type) {
        const map = {
          financial: "fin",
          progress: "prog",
          audit: "audit",
          quarterly: "q",
        };
        return map[type] || "fin";
      }

      function renderReports(reports) {
        const grid = document.getElementById("reportsGrid");
        const empty = document.getElementById("reportsEmpty");
        const loading = document.getElementById("reportsLoading");
        if (!grid) return;

        if (loading) loading.style.display = "none";

        if (!reports || reports.length === 0) {
          grid.innerHTML = "";
          if (empty) empty.style.display = "block";
          return;
        }

        if (empty) empty.style.display = "none";

        grid.innerHTML = reports
          .map((r) => {
            const hasFile = !!(r.file_url || r.file_path);
            const downloadUrl =
              r.file_url ||
              (r.file_path && window.mknBackend.getReportPublicUrl
                ? window.mknBackend.getReportPublicUrl(r.file_path)
                : "");

            // Pick translated type label
            const typeLabel =
              (window.i18n
                ? window.i18n.t("reports.type." + (r.type || "financial"))
                : r.type) || r.type;

            return `
        <div class="report-card reveal visible" data-report-id="${r.id}">
          <div class="rc-head">
            <div class="rc-icon ${typeClass(r.type)}">${typeIcon(r.type)}</div>
            <div>
              <div class="rc-type">${escapeHtml(typeLabel)}</div>
              <h3>${escapeHtml(r.title)}</h3>
            </div>
          </div>
          <p>${escapeHtml(r.description || "")}</p>
          <div class="rc-meta">
            <span>📅 <strong>${formatDate(r.report_date || r.created_at)}</strong></span>
            ${r.file_size ? `<span>📄 <strong>${formatSize(r.file_size)}</strong></span>` : ""}
            ${r.file_name ? `<span>📑 <strong>${escapeHtml(r.file_name.slice(0, 20))}</strong></span>` : ""}
          </div>
          ${
            hasFile && downloadUrl
              ? `<a href="${escapeHtml(downloadUrl)}" target="_blank" rel="noopener" class="rc-action" download>
                 📥 <span data-i18n="reports.download"></span>
               </a>`
              : `<span class="rc-action" style="color:var(--ink300);cursor:not-allowed;">
                 📄 <span data-i18n="reports.noFile"></span>
               </span>`
          }
        </div>
      `;
          })
          .join("");

        // Re-apply translations
        if (window.i18n && window.i18n.applyTranslations) {
          window.i18n.applyTranslations();
        }

        // Re-run counter animations
        if (window.mknCounter) {
          window.mknCounter.setup(".counter");
        }
      }

      async function loadReports() {
        if (!window.mknBackend) {
          console.warn("[Reports] mknBackend not available");
          return;
        }

        try {
          const res = await window.mknBackend.fetchReports({
            status: "published",
          });

          if (!res.success) {
            document.getElementById("reportsLoading").innerHTML =
              '<div style="font-size:40px;">⚠️</div><p>' + res.error + "</p>";
            return;
          }

          // Update stat: total reports
          const publishedCount = res.data.length;
          const statPub = document.getElementById("statPublished");
          if (statPub) {
            statPub.dataset.target = String(publishedCount);
            statPub.dataset.animated = "false";
            statPub.textContent = "0";
          }

          renderReports(res.data);

          // Reload counters after render
          setTimeout(() => {
            if (window.mknCounter) window.mknCounter.setup(".counter");
          }, 200);

          console.log("[Reports] ✓ Loaded", publishedCount, "reports");
        } catch (err) {
          console.error("[Reports] Error:", err);
        }
      }

      async function loadStats() {
        if (!window.mknBackend) return;
        try {
          const res = await window.mknBackend.fetchPledges({});
          if (res.success && res.data) {
            const total = res.data.reduce(
              (sum, p) => sum + (Number(p.amount) || 0),
              0,
            );
            const percent = (total / 190000000) * 100;

            const raisedEl = document.getElementById("statRaised");
            if (raisedEl) {
              raisedEl.dataset.target = String(total);
              raisedEl.dataset.animated = "false";
              raisedEl.textContent = "0";
            }

            const progEl = document.getElementById("statProgress");
            if (progEl) {
              progEl.dataset.target = percent.toFixed(1);
              progEl.dataset.decimals = "1";
              progEl.dataset.animated = "false";
              progEl.textContent = "0";
            }

            setTimeout(() => {
              if (window.mknCounter) window.mknCounter.setup(".counter");
            }, 200);
          }
        } catch (err) {
          console.warn("[Reports] Stats load failed:", err);
        }
      }

      // Load on ready
      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", () => {
          setTimeout(loadReports, 400);
          setTimeout(loadStats, 500);
        });
      } else {
        setTimeout(loadReports, 400);
        setTimeout(loadStats, 500);
      }

      // Reload on focus
      window.addEventListener("focus", () => setTimeout(loadReports, 300));
    </script>
  </body>
</html>
