<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>About — Malka Nono Project</title>
    <meta
      name="description"
      content="About the Malka Nono Islamic Affairs Council Property Development Project."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Ethiopic:wght@300;400;500;600;700;800&family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div id="site-nav"></div>

    <!-- ============ PAGE HERO ============ -->
    <header class="page-hero">
      <div class="container">
        <span class="page-tag" data-i18n="about.hero.tag"></span>
        <h1 data-i18n="about.hero.title"></h1>
        <p data-i18n="about.hero.lede"></p>
        <div class="breadcrumb">
          <a href="index.html" data-i18n="nav.home"></a>
          <span>/</span>
          <span data-i18n="nav.about"></span>
        </div>
      </div>
    </header>

    <!-- ============ SUMMARY ============ -->
    <section>
      <div class="container">
        <div class="section-head reveal">
          <span class="section-tag" data-i18n="about.tag"></span>
          <h2 data-i18n="about.summary.title"></h2>
        </div>
        <div class="grid grid-2">
          <div class="card reveal">
            <div class="card-icon">🏛️</div>
            <p data-i18n="about.summary.p1"></p>
          </div>
          <div class="card reveal">
            <div class="card-icon">🎯</div>
            <p data-i18n="about.summary.p2"></p>
          </div>
        </div>

        <div class="stats-strip reveal">
          <div class="item">
            <div class="num">85</div>
            <div class="lbl" data-i18n="hero.stat.mosques"></div>
          </div>
          <div class="item">
            <div class="num">3</div>
            <div class="lbl" data-i18n="hero.stat.districts"></div>
          </div>
          <div class="item">
            <div class="num">1,600 <small data-i18n="unit.sqm"></small></div>
            <div class="lbl" data-i18n="hero.stat.area"></div>
          </div>
          <div class="item">
            <div class="num">9</div>
            <div class="lbl" data-i18n="about.card4.title"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- ============ BACKGROUND ============ -->
    <section style="background: var(--g50)">
      <div class="container">
        <div class="section-head reveal">
          <span class="section-tag" data-i18n="about.background.tag"></span>
          <h2 data-i18n="about.background.title"></h2>
        </div>
        <div class="info-block reveal">
          <div>
            <h3 data-i18n="about.background.h3"></h3>
            <p data-i18n="about.background.p1"></p>
            <p data-i18n="about.background.p2"></p>
          </div>
          <div class="info-visual">🕌</div>
        </div>
        <div class="info-block reveal">
          <div class="info-visual">🏗️</div>
          <div>
            <h3 data-i18n="about.background.h3b"></h3>
            <p data-i18n="about.background.p3"></p>
            <p data-i18n="about.background.p4"></p>
          </div>
        </div>
      </div>
    </section>

    <!-- ============ CURRENT PROBLEMS ============ -->
    <section>
      <div class="container">
        <div class="section-head reveal">
          <span class="section-tag" data-i18n="problems.tag"></span>
          <h2 data-i18n="problems.title"></h2>
          <p data-i18n="problems.lede"></p>
        </div>
        <div class="grid grid-2">
          <div class="card problem reveal">
            <div class="card-icon">🏚️</div>
            <h3 data-i18n="problems.p1.title"></h3>
            <p data-i18n="problems.p1.long"></p>
          </div>
          <div class="card problem reveal">
            <div class="card-icon">🚗</div>
            <h3 data-i18n="problems.p2.title"></h3>
            <p data-i18n="problems.p2.long"></p>
          </div>
          <div class="card problem reveal">
            <div class="card-icon">📉</div>
            <h3 data-i18n="problems.p3.title"></h3>
            <p data-i18n="problems.p3.long"></p>
          </div>
          <div class="card problem reveal">
            <div class="card-icon">⚖️</div>
            <h3 data-i18n="problems.p4.title"></h3>
            <p data-i18n="problems.p4.long"></p>
          </div>
        </div>
      </div>
    </section>

    <!-- ============ IMPORTANCE ============ -->
    <section style="background: var(--g50)">
      <div class="container">
        <div class="section-head reveal">
          <span class="section-tag" data-i18n="about.importance.tag"></span>
          <h2 data-i18n="about.importance.title"></h2>
        </div>
        <div class="callout reveal">
          <strong data-i18n="about.importance.lead"></strong>
          <span data-i18n="about.importance.p1"></span>
        </div>
        <p
          style="
            max-width: 820px;
            margin: 24px auto;
            text-align: center;
            color: var(--ink500);
            font-size: 15.5px;
          "
          class="reveal"
          data-i18n="about.importance.p2"
        ></p>
      </div>
    </section>

    <!-- ============ VISION & OBJECTIVES ============ -->
    <section>
      <div class="container">
        <div class="section-head reveal">
          <span class="section-tag" data-i18n="objectives.tag"></span>
          <h2 data-i18n="about.vision.title"></h2>
          <p data-i18n="about.vision.lede"></p>
        </div>
        <ol class="objectives reveal">
          <li>
            <span class="num">1</span
            ><span class="text" data-i18n="obj.1"></span>
          </li>
          <li>
            <span class="num">2</span
            ><span class="text" data-i18n="obj.2"></span>
          </li>
          <li>
            <span class="num">3</span
            ><span class="text" data-i18n="obj.3"></span>
          </li>
          <li>
            <span class="num">4</span
            ><span class="text" data-i18n="obj.4"></span>
          </li>
          <li>
            <span class="num">5</span
            ><span class="text" data-i18n="obj.5"></span>
          </li>
          <li>
            <span class="num">6</span
            ><span class="text" data-i18n="obj.6"></span>
          </li>
          <li>
            <span class="num">7</span
            ><span class="text" data-i18n="obj.7"></span>
          </li>
          <li>
            <span class="num">8</span
            ><span class="text" data-i18n="obj.8"></span>
          </li>
        </ol>
      </div>
    </section>

    <!-- ============ BUILDING USAGE ============ -->
    <section style="background: var(--g50)">
      <div class="container">
        <div class="section-head reveal">
          <span class="section-tag" data-i18n="about.building.tag"></span>
          <h2 data-i18n="about.building.title"></h2>
          <p data-i18n="about.building.lede"></p>
        </div>
        <div class="grid grid-2">
          <div class="card reveal">
            <div class="card-icon">🏢</div>
            <h3 data-i18n="about.building.offices.title"></h3>
            <ul class="bullet-list">
              <li data-i18n="about.building.offices.i1"></li>
              <li data-i18n="about.building.offices.i2"></li>
              <li data-i18n="about.building.offices.i3"></li>
              <li data-i18n="about.building.offices.i4"></li>
              <li data-i18n="about.building.offices.i5"></li>
              <li data-i18n="about.building.offices.i6"></li>
              <li data-i18n="about.building.offices.i7"></li>
              <li data-i18n="about.building.offices.i8"></li>
              <li data-i18n="about.building.offices.i9"></li>
            </ul>
          </div>
          <div class="card reveal">
            <div class="card-icon">🏪</div>
            <h3 data-i18n="about.building.commercial.title"></h3>
            <p data-i18n="about.building.commercial.p1"></p>
            <p
              style="margin-top: 12px"
              data-i18n="about.building.commercial.p2"
            ></p>
            <ul class="bullet-list">
              <li data-i18n="about.building.commercial.i1"></li>
              <li data-i18n="about.building.commercial.i2"></li>
              <li data-i18n="about.building.commercial.i3"></li>
              <li data-i18n="about.building.commercial.i4"></li>
            </ul>
          </div>
        </div>
      </div>
    </section>

    <!-- ============ TRANSPORT ============ -->
    <section>
      <div class="container">
        <div class="section-head reveal">
          <span class="section-tag" data-i18n="about.transport.tag"></span>
          <h2 data-i18n="about.transport.title"></h2>
          <p data-i18n="about.transport.lede"></p>
        </div>
        <div class="grid grid-3">
          <div class="card reveal">
            <div class="card-icon">🚐</div>
            <h3 data-i18n="about.transport.v1.title"></h3>
            <p class="money" style="font-size: 22px; margin: 10px 0">
              3,500,000 ብር
            </p>
            <ul class="bullet-list">
              <li data-i18n="about.transport.v1.i1"></li>
              <li data-i18n="about.transport.v1.i2"></li>
              <li data-i18n="about.transport.v1.i3"></li>
              <li data-i18n="about.transport.v1.i4"></li>
            </ul>
          </div>
          <div class="card reveal">
            <div class="card-icon">⚡</div>
            <h3 data-i18n="about.transport.v2.title"></h3>
            <p class="money" style="font-size: 22px; margin: 10px 0">
              8,000,000 ብር
            </p>
            <p data-i18n="about.transport.v2.desc"></p>
          </div>
          <div class="card reveal">
            <div class="card-icon">🌱</div>
            <h3 data-i18n="about.transport.v3.title"></h3>
            <p data-i18n="about.transport.v3.desc"></p>
          </div>
        </div>
      </div>
    </section>

    <!-- ============ MANPOWER ============ -->
    <section style="background: var(--g50)">
      <div class="container">
        <div class="section-head reveal">
          <span class="section-tag" data-i18n="about.manpower.tag"></span>
          <h2 data-i18n="about.manpower.title"></h2>
          <p data-i18n="about.manpower.lede"></p>
        </div>
        <div class="table-wrap reveal">
          <table>
            <thead>
              <tr>
                <th data-i18n="budget.th.item"></th>
                <th class="num" data-i18n="about.manpower.th.count"></th>
                <th class="num" data-i18n="about.manpower.th.salary"></th>
                <th class="num" data-i18n="about.manpower.th.monthly"></th>
                <th class="num" data-i18n="about.manpower.th.yearly"></th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td data-i18n="about.manpower.r1.title"></td>
                <td class="num">1</td>
                <td class="num">30,000</td>
                <td class="num">30,000</td>
                <td class="num">360,000</td>
              </tr>
              <tr>
                <td data-i18n="about.manpower.r2.title"></td>
                <td class="num">2</td>
                <td class="num">25,000</td>
                <td class="num">50,000</td>
                <td class="num">600,000</td>
              </tr>
              <tr>
                <td data-i18n="about.manpower.r3.title"></td>
                <td class="num">6</td>
                <td class="num">20,000</td>
                <td class="num">120,000</td>
                <td class="num">1,440,000</td>
              </tr>
              <tr class="total">
                <td data-i18n="budget.total"></td>
                <td class="num">9</td>
                <td class="num">—</td>
                <td class="num">200,000</td>
                <td class="num">2,400,000</td>
              </tr>
            </tbody>
          </table>
        </div>
        <p
          style="
            text-align: center;
            color: var(--ink500);
            font-size: 14px;
            margin-top: 18px;
          "
          class="reveal"
          data-i18n="about.manpower.note"
        ></p>
      </div>
    </section>

    <!-- ============ CTA ============ -->
    <section style="padding-top: 0">
      <div class="cta-banner reveal">
        <h2 data-i18n="cta.title"></h2>
        <p data-i18n="cta.desc"></p>
        <a href="fundraising.html" class="btn btn-gold" data-i18n="cta.btn"></a>
      </div>
    </section>

    <div id="site-footer"></div>

    <script src="js/translations.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
