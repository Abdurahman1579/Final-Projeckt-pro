<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>News — Malka Nono Project</title>
    <meta
      name="description"
      content="Latest updates, announcements, and progress from the Malka Nono project."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Ethiopic:wght@300;400;500;600;700;800&family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div id="site-nav"></div>

    <!-- ============ PAGE HERO ============ -->
    <header class="page-hero">
      <div class="container">
        <span class="page-tag" data-i18n="news.hero.tag"></span>
        <h1 data-i18n="news.hero.title"></h1>
        <p data-i18n="news.hero.lede"></p>
        <div class="breadcrumb">
          <a href="index.html" data-i18n="nav.home"></a>
          <span>/</span>
          <span data-i18n="nav.news"></span>
        </div>
      </div>
    </header>

    <!-- ============ FEATURED NEWS ============ -->
    <section>
      <div class="container">
        <div class="news-featured reveal">
          <div class="visual"><span>🏗️</span></div>
          <div class="content">
            <span class="badge" data-i18n="news.featured.badge"></span>
            <h2 data-i18n="news.featured.title"></h2>
            <p data-i18n="news.featured.excerpt"></p>
            <div class="meta">
              <span>📅 <strong data-i18n="news.featured.date"></strong></span>
              <span>✍️ <strong data-i18n="news.featured.author"></strong></span>
            </div>
            <a
              href="#"
              class="btn btn-primary"
              style="margin-top: 20px; align-self: flex-start"
              data-i18n="common.readMore"
            ></a>
          </div>
        </div>

        <!-- Filter chips -->
        <div class="news-filter reveal">
          <button
            class="filter-chip active"
            data-filter="all"
            data-i18n="news.filter.all"
          ></button>
          <button
            class="filter-chip"
            data-filter="progress"
            data-i18n="news.filter.progress"
          ></button>
          <button
            class="filter-chip"
            data-filter="fundraising"
            data-i18n="news.filter.fundraising"
          ></button>
          <button
            class="filter-chip"
            data-filter="community"
            data-i18n="news.filter.community"
          ></button>
          <button
            class="filter-chip"
            data-filter="announcement"
            data-i18n="news.filter.announcement"
          ></button>
        </div>

        <!-- News grid -->
        <div class="news-grid" id="newsGrid">
          <!-- Loaded dynamically from Supabase -->
          <article class="news-card reveal" data-cat="loading">
            <div class="thumb"><span class="cat">Loading...</span>⏳</div>
            <div class="body">
              <div class="date">Please wait</div>
              <h3>Loading news from server...</h3>
              <p>Please wait a moment.</p>
            </div>
          </article>
        </div>

        <!-- Empty state -->
        <div class="empty-state" id="newsEmpty" style="display: none">
          <div class="icon">📭</div>
          <h3 data-i18n="news.empty.title"></h3>
          <p data-i18n="news.empty.desc"></p>
        </div>
      </div>
    </section>

    <!-- ============ NEWSLETTER ============ -->
    <section style="padding-top: 0">
      <div class="container">
        <div class="newsletter reveal">
          <h3 data-i18n="news.newsletter.title"></h3>
          <p data-i18n="news.newsletter.desc"></p>
          <form class="newsletter-form" id="newsletterForm">
            <input type="email" placeholder="you@example.com" required />
            <button type="submit" data-i18n="news.newsletter.btn"></button>
          </form>
          <div
            class="form-success"
            id="newsletterSuccess"
            data-i18n="news.newsletter.success"
            style="
              max-width: 480px;
              margin: 16px auto 0;
              color: var(--g900);
              background: var(--gd100);
              border-color: var(--gd400);
            "
          ></div>
        </div>
      </div>
    </section>

    <div id="site-footer"></div>

    <!-- ============ SCRIPTS ============ -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/translations.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/main.js"></script>
    <script src="js/supabase.js"></script>
    <script>
      /* ============================================================
     NEWS PAGE — Load from Supabase
     ============================================================ */

      function categoryIcon(cat) {
        const map = {
          announcement: "📢",
          progress: "🏗️",
          fundraising: "💰",
          community: "🤝",
        };
        return map[cat] || "📰";
      }

      function formatDate(iso) {
        if (!iso) return "";
        const d = new Date(iso);
        const months = [
          "Jan",
          "Feb",
          "Mar",
          "Apr",
          "May",
          "Jun",
          "Jul",
          "Aug",
          "Sep",
          "Oct",
          "Nov",
          "Dec",
        ];
        return (
          months[d.getMonth()] + " " + d.getDate() + ", " + d.getFullYear()
        );
      }

      function escapeHtml(s) {
        if (!s) return "";
        return String(s).replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      }

      function setupFilters() {
        document.querySelectorAll(".filter-chip").forEach((chip) => {
          // Remove existing listeners by cloning
          const clone = chip.cloneNode(true);
          chip.parentNode.replaceChild(clone, chip);
        });
        document.querySelectorAll(".filter-chip").forEach((chip) => {
          chip.addEventListener("click", () => {
            document
              .querySelectorAll(".filter-chip")
              .forEach((c) => c.classList.remove("active"));
            chip.classList.add("active");
            const filter = chip.dataset.filter;
            let visible = 0;
            document
              .querySelectorAll("#newsGrid .news-card")
              .forEach((card) => {
                const show = filter === "all" || card.dataset.cat === filter;
                card.style.display = show ? "flex" : "none";
                if (show) visible++;
              });
            const empty = document.getElementById("newsEmpty");
            if (empty) empty.style.display = visible === 0 ? "block" : "none";
          });
        });
      }

      async function loadNews() {
        if (!window.mknBackend) {
          console.warn("[News] mknBackend not available");
          return;
        }

        const res = await window.mknBackend.fetchNews({ status: "published" });
        if (!res.success || !res.data || res.data.length === 0) {
          console.warn("[News] No news found:", res.error);
          const grid = document.getElementById("newsGrid");
          if (grid) grid.innerHTML = "";
          document.getElementById("newsEmpty").style.display = "block";
          return;
        }

        const news = res.data;
        const featured = news.find((n) => n.featured) || news[0];
        const others = news.filter((n) => n.id !== featured.id);

        // ---- Featured ----
        const featuredBox = document.querySelector(".news-featured");
        if (featuredBox && featured) {
          const badge = featuredBox.querySelector(".badge");
          const title = featuredBox.querySelector("h2");
          const excerpt = featuredBox.querySelector("p");
          const dateEl = featuredBox.querySelector(".meta strong");
          const icon = featuredBox.querySelector(".visual span");

          if (badge) {
            badge.textContent = featured.category || "Featured";
            badge.removeAttribute("data-i18n");
          }
          if (title) {
            title.textContent = featured.title;
            title.removeAttribute("data-i18n");
          }
          if (excerpt) {
            excerpt.textContent = featured.excerpt || "";
            excerpt.removeAttribute("data-i18n");
          }
          if (dateEl) {
            dateEl.textContent = formatDate(featured.created_at);
            dateEl.removeAttribute("data-i18n");
          }
          if (icon) icon.textContent = categoryIcon(featured.category);
        }

        // ---- Grid ----
        const grid = document.getElementById("newsGrid");
        if (grid) {
          if (others.length === 0) {
            grid.innerHTML = "";
            document.getElementById("newsEmpty").style.display = "block";
          } else {
            grid.innerHTML = others
              .map(
                (n) => `
          <article class="news-card reveal visible" data-cat="${escapeHtml(n.category || "announcement")}">
            <div class="thumb">
              <span class="cat">${escapeHtml(n.category || "News")}</span>
              ${categoryIcon(n.category)}
            </div>
            <div class="body">
              <div class="date">${formatDate(n.created_at)}</div>
              <h3>${escapeHtml(n.title)}</h3>
              <p>${escapeHtml(n.excerpt || "")}</p>
              <a href="#" class="read-more" data-news-id="${n.id}">
                <span data-i18n="common.readMore"></span> →
              </a>
            </div>
          </article>
        `,
              )
              .join("");
            document.getElementById("newsEmpty").style.display = "none";

            // Re-apply translations
            if (window.i18n && window.i18n.applyTranslations) {
              window.i18n.applyTranslations();
            }
          }
        }

        // Re-setup filters
        setupFilters();

        console.log("[News] ✓ Loaded", news.length, "articles");
      }

      // Load on ready
      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", () =>
          setTimeout(loadNews, 300),
        );
      } else {
        setTimeout(loadNews, 300);
      }

      // Re-setup filters on initial load (for hardcoded chips)
      setTimeout(setupFilters, 400);

      /* ============================================================
     NEWSLETTER SUBMIT
     ============================================================ */
      const nlForm = document.getElementById("newsletterForm");
      if (nlForm) {
        nlForm.addEventListener("submit", async (e) => {
          e.preventDefault();
          const btn = nlForm.querySelector('button[type="submit"]');
          const success = document.getElementById("newsletterSuccess");
          const originalText = btn.innerHTML;
          const email = nlForm
            .querySelector('input[type="email"]')
            .value.trim();

          btn.disabled = true;
          btn.innerHTML = "⏳";

          const result = await window.mknBackend.subscribeNewsletter(email);

          btn.disabled = false;
          btn.innerHTML = originalText;

          if (result.success) {
            success.classList.add("show");
            success.textContent = result.duplicate
              ? result.message || "Already subscribed!"
              : window.i18n
                ? window.i18n.t("news.newsletter.success")
                : "Subscribed!";
            nlForm.reset();
            setTimeout(() => success.classList.remove("show"), 6000);
            if (window.showToast) window.showToast("✓ Subscribed!", "success");
          } else {
            if (window.showToast) window.showToast(result.error, "error");
          }
        });
      }
    </script>
  </body>
</html>
