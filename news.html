<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>News — Malka Nono Project</title>
    <meta
      name="description"
      content="Latest updates, announcements, and progress from the Malka Nono project."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Ethiopic:wght@300;400;500;600;700;800&family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div id="site-nav"></div>

    <!-- ============ PAGE HERO ============ -->
    <header class="page-hero">
      <div class="container">
        <span class="page-tag" data-i18n="news.hero.tag"></span>
        <h1 data-i18n="news.hero.title"></h1>
        <p data-i18n="news.hero.lede"></p>
        <div class="breadcrumb">
          <a href="index.html" data-i18n="nav.home"></a>
          <span>/</span>
          <span data-i18n="nav.news"></span>
        </div>
      </div>
    </header>

    <!-- ============ NEWS LIST ============ -->
    <section>
      <div class="container">
        <div
          id="newsLoading"
          style="text-align: center; padding: 40px 0; color: var(--ink500)"
        >
          <div style="font-size: 40px; margin-bottom: 10px">⏳</div>
          <p>Loading news...</p>
        </div>

        <!-- Featured -->
        <div
          class="news-featured reveal"
          id="featuredBox"
          style="display: none"
        >
          <div class="visual"><span id="featuredIcon">🏗️</span></div>
          <div class="content">
            <span class="badge" id="featuredBadge">Featured</span>
            <h2 id="featuredTitle">—</h2>
            <p id="featuredExcerpt">—</p>
            <div class="meta">
              <span>📅 <strong id="featuredDate">—</strong></span>
              <span
                >✍️ <strong id="featuredAuthor">Council Office</strong></span
              >
            </div>
            <button
              type="button"
              class="btn btn-primary"
              style="margin-top: 20px; align-self: flex-start"
              id="featuredReadBtn"
              data-i18n="common.readMore"
            ></button>
          </div>
        </div>

        <!-- Filters -->
        <div class="news-filter reveal" id="newsFilter" style="display: none">
          <button
            class="filter-chip active"
            data-filter="all"
            data-i18n="news.filter.all"
          ></button>
          <button
            class="filter-chip"
            data-filter="progress"
            data-i18n="news.filter.progress"
          ></button>
          <button
            class="filter-chip"
            data-filter="fundraising"
            data-i18n="news.filter.fundraising"
          ></button>
          <button
            class="filter-chip"
            data-filter="community"
            data-i18n="news.filter.community"
          ></button>
          <button
            class="filter-chip"
            data-filter="announcement"
            data-i18n="news.filter.announcement"
          ></button>
        </div>

        <!-- Grid -->
        <div class="news-grid" id="newsGrid"></div>

        <!-- Empty -->
        <div class="empty-state" id="newsEmpty" style="display: none">
          <div class="icon">📭</div>
          <h3 data-i18n="news.empty.title"></h3>
          <p data-i18n="news.empty.desc"></p>
        </div>
      </div>
    </section>

    <!-- ============ NEWSLETTER ============ -->
    <section style="padding-top: 0">
      <div class="container">
        <div class="newsletter reveal">
          <h3 data-i18n="news.newsletter.title"></h3>
          <p data-i18n="news.newsletter.desc"></p>
          <form class="newsletter-form" id="newsletterForm">
            <input type="email" placeholder="you@example.com" required />
            <button type="submit" data-i18n="news.newsletter.btn"></button>
          </form>
          <div
            class="form-success"
            id="newsletterSuccess"
            data-i18n="news.newsletter.success"
            style="
              max-width: 480px;
              margin: 16px auto 0;
              color: var(--g900);
              background: var(--gd100);
              border-color: var(--gd400);
            "
          ></div>
        </div>
      </div>
    </section>

    <!-- ============ NEWS DETAIL MODAL ============ -->
    <div class="news-modal-overlay" id="newsModal">
      <div class="news-modal">
        <div class="news-modal-head">
          <span class="news-modal-badge" id="nmBadge">Announcement</span>
          <button class="news-modal-close" id="nmClose" aria-label="Close">
            ×
          </button>
        </div>
        <div class="news-modal-visual" id="nmVisual">
          <span id="nmIcon">📢</span>
        </div>
        <div class="news-modal-body">
          <h2 class="news-modal-title" id="nmTitle">Title</h2>
          <div class="news-modal-meta">
            <span>📅 <strong id="nmDate">—</strong></span>
            <span>✍️ <strong id="nmAuthor">Council Office</strong></span>
          </div>
          <div class="news-modal-content" id="nmContent">
            <p>Content...</p>
          </div>
        </div>
        <div class="news-modal-foot">
          <button
            class="btn btn-ghost"
            id="nmCloseBtn"
            data-i18n="common.close"
          >
            Close
          </button>
        </div>
      </div>
    </div>

    <div id="site-footer"></div>

    <!-- ============ SCRIPTS ============ -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/translations.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/main.js"></script>
    <script src="js/supabase.js"></script>
    <script>
      /* ============================================================
     NEWS PAGE — Load from Supabase + Detail Modal
     ============================================================ */

      const DEBUG = true;
      function log(...args) {
        if (DEBUG) console.log("[News]", ...args);
      }

      let allNews = []; // Store all fetched articles for modal lookup
      let featuredId = null; // Track current featured

      /* ---- Helpers ---- */
      function categoryIcon(cat) {
        const map = {
          announcement: "📢",
          progress: "🏗️",
          fundraising: "💰",
          community: "🤝",
        };
        return map[cat] || "📰";
      }

      function formatDate(iso) {
        if (!iso) return "";
        try {
          const d = new Date(iso);
          const months = [
            "Jan",
            "Feb",
            "Mar",
            "Apr",
            "May",
            "Jun",
            "Jul",
            "Aug",
            "Sep",
            "Oct",
            "Nov",
            "Dec",
          ];
          return (
            months[d.getMonth()] + " " + d.getDate() + ", " + d.getFullYear()
          );
        } catch (e) {
          return "";
        }
      }

      function escapeHtml(s) {
        if (s === null || s === undefined) return "";
        return String(s).replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      }

      /* ============================================================
     MODAL — Open / Close
     ============================================================ */
      function openNewsModal(id) {
        const article = allNews.find((n) => n.id === id);
        if (!article) {
          log("Article not found:", id);
          return;
        }

        // Fill modal
        document.getElementById("nmBadge").textContent =
          article.category || "Announcement";
        document.getElementById("nmIcon").textContent = categoryIcon(
          article.category,
        );
        document.getElementById("nmTitle").textContent =
          article.title || "Untitled";
        document.getElementById("nmDate").textContent = formatDate(
          article.created_at,
        );
        document.getElementById("nmAuthor").textContent =
          article.author || "Council Office";

        // Content — render with paragraphs
        const content =
          article.content || article.excerpt || "No content available.";
        const paragraphs = content.split(/\n\n+/).filter(Boolean);
        document.getElementById("nmContent").innerHTML = paragraphs
          .map((p) => `<p>${escapeHtml(p).replace(/\n/g, "<br/>")}</p>`)
          .join("");

        // Badge color by category
        const badge = document.getElementById("nmBadge");
        badge.className = "news-modal-badge";
        badge.classList.add("cat-" + (article.category || "announcement"));

        // Open
        const modal = document.getElementById("newsModal");
        modal.classList.add("show");
        document.body.style.overflow = "hidden";

        // Scroll modal to top
        setTimeout(() => {
          const body = modal.querySelector(".news-modal-body");
          if (body) body.scrollTop = 0;
        }, 50);

        log("Opened modal:", article.title);
      }

      function closeNewsModal() {
        document.getElementById("newsModal").classList.remove("show");
        document.body.style.overflow = "";
      }

      // Close handlers
      document
        .getElementById("nmClose")
        ?.addEventListener("click", closeNewsModal);
      document
        .getElementById("nmCloseBtn")
        ?.addEventListener("click", closeNewsModal);
      document.getElementById("newsModal")?.addEventListener("click", (e) => {
        if (e.target.id === "newsModal") closeNewsModal();
      });
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") closeNewsModal();
      });

      /* ============================================================
     FILTERS
     ============================================================ */
      function setupFilters() {
        document.querySelectorAll(".filter-chip").forEach((chip) => {
          const clone = chip.cloneNode(true);
          chip.parentNode.replaceChild(clone, chip);
        });
        document.querySelectorAll(".filter-chip").forEach((chip) => {
          chip.addEventListener("click", () => {
            document
              .querySelectorAll(".filter-chip")
              .forEach((c) => c.classList.remove("active"));
            chip.classList.add("active");
            const filter = chip.dataset.filter;
            let visible = 0;
            document
              .querySelectorAll("#newsGrid .news-card")
              .forEach((card) => {
                const show = filter === "all" || card.dataset.cat === filter;
                card.style.display = show ? "flex" : "none";
                if (show) visible++;
              });
            const empty = document.getElementById("newsEmpty");
            if (empty) empty.style.display = visible === 0 ? "block" : "none";
          });
        });
      }

      /* ============================================================
     RENDER
     ============================================================ */
      function renderFeatured(n) {
        const box = document.getElementById("featuredBox");
        if (!box || !n) return;

        featuredId = n.id;

        document.getElementById("featuredIcon").textContent = categoryIcon(
          n.category,
        );
        document.getElementById("featuredBadge").textContent =
          n.category || "Featured";
        document.getElementById("featuredTitle").textContent =
          n.title || "Untitled";
        document.getElementById("featuredExcerpt").textContent =
          n.excerpt || "";
        document.getElementById("featuredDate").textContent = formatDate(
          n.created_at,
        );
        document.getElementById("featuredAuthor").textContent =
          n.author || "Council Office";

        // Read more button → open modal
        const btn = document.getElementById("featuredReadBtn");
        if (btn) {
          btn.onclick = () => openNewsModal(n.id);
        }

        box.style.display = "grid";
      }

      function renderGrid(articles) {
        const grid = document.getElementById("newsGrid");
        const empty = document.getElementById("newsEmpty");
        if (!grid) return;

        if (!articles || articles.length === 0) {
          grid.innerHTML = "";
          grid.style.display = "none";
          if (empty) empty.style.display = "block";
          return;
        }

        grid.style.display = "grid";
        if (empty) empty.style.display = "none";

        grid.innerHTML = articles
          .map(
            (n) => `
      <article class="news-card reveal visible" data-cat="${escapeHtml(n.category || "announcement")}" data-news-id="${n.id}">
        <div class="thumb">
          <span class="cat">${escapeHtml(n.category || "News")}</span>
          ${categoryIcon(n.category)}
        </div>
        <div class="body">
          <div class="date">${formatDate(n.created_at)}</div>
          <h3>${escapeHtml(n.title)}</h3>
          <p>${escapeHtml(n.excerpt || "")}</p>
          <button type="button" class="read-more" data-open-news="${n.id}">
            <span data-i18n="common.readMore"></span> →
          </button>
        </div>
      </article>
    `,
          )
          .join("");

        // Attach click handlers on read-more buttons
        grid.querySelectorAll("[data-open-news]").forEach((btn) => {
          btn.addEventListener("click", (e) => {
            e.preventDefault();
            e.stopPropagation();
            openNewsModal(btn.dataset.openNews);
          });
        });

        // Also allow clicking the whole card
        grid.querySelectorAll(".news-card").forEach((card) => {
          card.addEventListener("click", (e) => {
            if (e.target.closest("[data-open-news]")) return; // already handled
            openNewsModal(card.dataset.newsId);
          });
        });

        if (window.i18n && window.i18n.applyTranslations) {
          window.i18n.applyTranslations();
        }

        setupFilters();
      }

      /* ============================================================
     LOAD
     ============================================================ */
      async function loadNews() {
        log("Starting fetch...");

        const loading = document.getElementById("newsLoading");
        const featuredBox = document.getElementById("featuredBox");
        const filterBox = document.getElementById("newsFilter");

        if (loading) loading.style.display = "block";
        if (featuredBox) featuredBox.style.display = "none";
        if (filterBox) filterBox.style.display = "none";

        if (!window.mknBackend) {
          log("ERROR: mknBackend not available");
          if (loading)
            loading.innerHTML =
              '<div style="font-size:40px;">⚠️</div><p>Supabase not loaded.</p>';
          return;
        }

        try {
          const res = await window.mknBackend.fetchNews({
            status: "published",
          });
          log("Fetch result:", res.success, "count:", res.data?.length);

          if (!res.success) {
            if (loading)
              loading.innerHTML =
                '<div style="font-size:40px;">⚠️</div><p>' + res.error + "</p>";
            return;
          }

          allNews = res.data || [];

          if (loading) loading.style.display = "none";

          if (allNews.length === 0) {
            document.getElementById("newsEmpty").style.display = "block";
            return;
          }

          // Featured = flagged OR latest
          let featured = allNews.find((n) => n.featured);
          if (!featured) featured = allNews[0];

          const others = allNews.filter((n) => n.id !== featured.id);

          renderFeatured(featured);
          renderGrid(others);
          if (filterBox) filterBox.style.display = "flex";

          log("✓ Rendered:", allNews.length, "articles");
        } catch (err) {
          log("Exception:", err);
          if (loading)
            loading.innerHTML =
              '<div style="font-size:40px;">⚠️</div><p>' + err.message + "</p>";
        }
      }

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", () =>
          setTimeout(loadNews, 400),
        );
      } else {
        setTimeout(loadNews, 400);
      }

      /* ---- Newsletter ---- */
      const nlForm = document.getElementById("newsletterForm");
      if (nlForm) {
        nlForm.addEventListener("submit", async (e) => {
          e.preventDefault();
          const btn = nlForm.querySelector('button[type="submit"]');
          const success = document.getElementById("newsletterSuccess");
          const originalText = btn.innerHTML;
          const email = nlForm
            .querySelector('input[type="email"]')
            .value.trim();

          btn.disabled = true;
          btn.innerHTML = "⏳";

          const result = await window.mknBackend.subscribeNewsletter(email);

          btn.disabled = false;
          btn.innerHTML = originalText;

          if (result.success) {
            success.classList.add("show");
            success.textContent = result.duplicate
              ? result.message || "Already subscribed!"
              : window.i18n
                ? window.i18n.t("news.newsletter.success")
                : "Subscribed!";
            nlForm.reset();
            setTimeout(() => success.classList.remove("show"), 6000);
          } else {
            if (window.showToast) window.showToast(result.error, "error");
          }
        });
      }

      console.log("[News] ✓ Page ready");
    </script>
  </body>
</html>
