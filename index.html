<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Malka Nono — Project Proposal</title>
    <meta
      name="description"
      content="Sustainable Property, Transportation & Income Development Project for Malka Nono Islamic Affairs Council."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Ethiopic:wght@300;400;500;600;700;800&family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <!-- Navbar injected by layout.js -->
    <div id="site-nav"></div>

    <!-- ============ HERO ============ -->
    <header class="hero" id="top">
      <div class="hero-inner">
        <div class="eyebrow" data-i18n="hero.badge"></div>
        <h1>
          <span data-i18n="hero.title.1"></span><br />
          <span class="accent" data-i18n="hero.title.2"></span>
          <span data-i18n="hero.title.3"></span>
        </h1>
        <p class="lede" data-i18n="hero.lede"></p>

        <div class="hero-cta">
          <a
            href="budget.html"
            class="btn btn-primary"
            data-i18n="hero.cta.budget"
          ></a>
          <a
            href="fundraising.html"
            class="btn btn-ghost"
            data-i18n="hero.cta.fund"
          ></a>
        </div>

        <div class="hero-stats">
          <div class="stat">
            <div class="stat-num">
              190<small> <span data-i18n="unit.million"></span></small>
            </div>
            <div class="stat-label" data-i18n="hero.stat.budget"></div>
          </div>
          <div class="stat">
            <div class="stat-num">85</div>
            <div class="stat-label" data-i18n="hero.stat.mosques"></div>
          </div>
          <div class="stat">
            <div class="stat-num">
              1,600 <small><span data-i18n="unit.sqm"></span></small>
            </div>
            <div class="stat-label" data-i18n="hero.stat.area"></div>
          </div>
          <div class="stat">
            <div class="stat-num">3</div>
            <div class="stat-label" data-i18n="hero.stat.districts"></div>
          </div>
        </div>
      </div>
    </header>

    <!-- ============ LIVE PROGRESS CARD ============ -->
    <section
      class="progress-section"
      style="
        padding: 40px 24px 60px;
        background: linear-gradient(180deg, var(--paper) 0%, var(--g50) 100%);
      "
    >
      <div class="container" style="max-width: 720px">
        <div class="progress-card reveal">
          <!-- Header -->
          <div class="pc-head">
            <span class="dot"></span>
            <span data-i18n="fund.progress.title"></span>
          </div>

          <!-- Big percentage -->
          <div class="pc-percent">
            <span
              class="counter"
              data-target="0"
              data-decimals="1"
              data-suffix="%"
              data-start="0"
              >0.0%</span
            >
          </div>

          <!-- Progress bar -->
          <div class="progress-bar">
            <div class="fill" style="width: 0%"></div>
          </div>

          <!-- Stats row 1: Raised + Goal -->
          <div class="pc-stats">
            <div class="pc-stat green">
              <span class="pc-lbl" data-i18n="fund.stat.raised"></span>
              <span
                class="counter pc-num"
                data-target="0"
                data-suffix=" ብር"
                data-start="0"
                >0 ብር</span
              >
            </div>
            <div class="pc-stat gold">
              <span class="pc-lbl" data-i18n="fund.stat.goal"></span>
              <span
                class="counter pc-num"
                data-target="190000000"
                data-suffix=" ብር"
                data-start="0"
                >0 ብር</span
              >
            </div>
          </div>

          <!-- Stats row 2: Donors + Mosques -->
          <div class="pc-stats">
            <div class="pc-stat">
              <span class="counter pc-num-lg" data-target="0" data-start="0"
                >0</span
              >
              <span class="pc-lbl" data-i18n="fund.stat.donors"></span>
            </div>
            <div class="pc-stat">
              <span class="counter pc-num-lg" data-target="85" data-start="0"
                >0</span
              >
              <span class="pc-lbl" data-i18n="fund.stat.mosques"></span>
            </div>
          </div>

          <!-- CTA -->
          <a
            href="donate.html"
            class="btn btn-primary pc-cta"
            data-i18n="hero.cta.donate"
          >
            ይለግሱ — ተሳታፊ ይሁኑ →
          </a>
        </div>
      </div>
    </section>

    <!-- ============ ABOUT ============ -->
    <section id="about">
      <div class="container">
        <div class="section-head reveal">
          <span class="section-tag" data-i18n="about.tag"></span>
          <h2 data-i18n="about.title"></h2>
          <p data-i18n="about.lede"></p>
        </div>

        <div class="grid grid-2">
          <div class="card reveal">
            <div class="card-icon">🏢</div>
            <h3 data-i18n="about.card1.title"></h3>
            <p data-i18n="about.card1.desc"></p>
          </div>
          <div class="card reveal">
            <div class="card-icon">💰</div>
            <h3 data-i18n="about.card2.title"></h3>
            <p data-i18n="about.card2.desc"></p>
          </div>
          <div class="card reveal">
            <div class="card-icon">🕌</div>
            <h3 data-i18n="about.card3.title"></h3>
            <p data-i18n="about.card3.desc"></p>
          </div>
          <div class="card reveal">
            <div class="card-icon">👥</div>
            <h3 data-i18n="about.card4.title"></h3>
            <p data-i18n="about.card4.desc"></p>
          </div>
        </div>
      </div>
    </section>

    <!-- ============ PROBLEMS ============ -->
    <section id="problems" style="background: var(--g50)">
      <div class="container">
        <div class="section-head reveal">
          <span class="section-tag" data-i18n="problems.tag"></span>
          <h2 data-i18n="problems.title"></h2>
          <p data-i18n="problems.lede"></p>
        </div>
        <div class="grid grid-4">
          <div class="card problem reveal">
            <div class="card-icon">🏚️</div>
            <h3 data-i18n="problems.p1.title"></h3>
            <p data-i18n="problems.p1.desc"></p>
          </div>
          <div class="card problem reveal">
            <div class="card-icon">🚗</div>
            <h3 data-i18n="problems.p2.title"></h3>
            <p data-i18n="problems.p2.desc"></p>
          </div>
          <div class="card problem reveal">
            <div class="card-icon">📉</div>
            <h3 data-i18n="problems.p3.title"></h3>
            <p data-i18n="problems.p3.desc"></p>
          </div>
          <div class="card problem reveal">
            <div class="card-icon">⚖️</div>
            <h3 data-i18n="problems.p4.title"></h3>
            <p data-i18n="problems.p4.desc"></p>
          </div>
        </div>
      </div>
    </section>

    <!-- ============ CTA ============ -->
    <section style="padding-top: 0">
      <div class="cta-banner reveal">
        <h2 data-i18n="cta.title"></h2>
        <p data-i18n="cta.desc"></p>
        <a href="donate.html" class="btn btn-gold" data-i18n="cta.btn"></a>
      </div>
    </section>

    <!-- Footer injected by layout.js -->
    <div id="site-footer"></div>

    <!-- ============ SCRIPTS (order matters!) ============ -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/translations.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/main.js"></script>
    <script src="js/supabase.js"></script>
    <script src="js/counter.js"></script>
    <script src="js/index-data.js"></script>
  </body>
</html>
