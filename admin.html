<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin — Malka Nono Project</title>
    <meta name="robots" content="noindex, nofollow" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Ethiopic:wght@300;400;500;600;700;800&family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <!-- ============ LOGIN SCREEN ============ -->
    <div class="login-screen" id="loginScreen">
      <!-- 🌙 THEME TOGGLE (top-left) -->
      <button
        class="login-theme-toggle"
        id="loginThemeToggle"
        aria-label="Toggle theme"
        title="Dark mode"
      >
        🌙
      </button>

      <!-- 🌐 LANGUAGE SWITCHER (top-right) -->
      <div class="lang-switcher login-lang" id="langSwitcherLogin">
        <button class="lang-btn" id="langBtnLogin" aria-label="Change language">
          <span class="lang-current">AM</span>
          <svg width="10" height="10" viewBox="0 0 10 10" fill="none">
            <path
              d="M1 3l4 4 4-4"
              stroke="currentColor"
              stroke-width="1.6"
              stroke-linecap="round"
            />
          </svg>
        </button>
        <div class="lang-dropdown">
          <button class="lang-option" data-lang="en">
            <span class="lang-flag">🇬🇧</span> English
          </button>
          <button class="lang-option" data-lang="am">
            <span class="lang-flag">🇪🇹</span> አማርኛ
          </button>
          <button class="lang-option" data-lang="om">
            <span class="lang-flag">🌳</span> Oromoo
          </button>
          <button class="lang-option" data-lang="ar">
            <span class="lang-flag">🇸🇦</span> العربية
          </button>
        </div>
      </div>

      <div class="login-card">
        <div class="login-brand">
          <div class="logo">☪</div>
          <h1 data-i18n="admin.login.title"></h1>
          <p data-i18n="admin.login.subtitle"></p>
        </div>

        <!-- ❌ DEMO HINT REMOVED — አሁን የለም -->
        <!-- <div class="login-hint">...</div> -->

        <div
          class="login-error"
          id="loginError"
          data-i18n="admin.login.error"
        ></div>

        <form id="loginForm" novalidate>
          <div class="form-group">
            <label
              class="form-label"
              for="adminUser"
              data-i18n="admin.login.username"
            ></label>
            <input
              class="form-input"
              type="text"
              id="adminUser"
              autocomplete="username"
              required
            />
          </div>
          <div class="form-group">
            <label
              class="form-label"
              for="adminPass"
              data-i18n="admin.login.password"
            ></label>
            <input
              class="form-input"
              type="password"
              id="adminPass"
              autocomplete="current-password"
              required
            />
          </div>
          <div class="form-group">
            <button
              type="submit"
              class="btn btn-primary"
              style="width: 100%; justify-content: center"
              data-i18n="admin.login.submit"
            ></button>
          </div>
        </form>
        <div class="login-footer">
          <a href="index.html" data-i18n="admin.login.back"></a>
        </div>
      </div>
    </div>

    <!-- ============ ADMIN APP ============ -->
    <div class="admin-app" id="adminApp">
      <div class="admin-mobile-overlay" id="mobileOverlay"></div>

      <div class="admin-layout">
        <!-- ============ SIDEBAR ============ -->
        <aside class="admin-sidebar" id="adminSidebar">
          <div class="admin-brand">
            <div class="logo">☪</div>
            <div class="txt">
              <span data-i18n="admin.brand"></span>
              <small data-i18n="admin.brandSub"></small>
            </div>
            <!-- ❌ CLOSE BUTTON (×) — only shows on mobile -->
            <button
              class="sidebar-close"
              id="sidebarClose"
              aria-label="Close menu"
              type="button"
            >
              ×
            </button>
          </div>

          <ul class="admin-nav" id="adminNav">
            <li>
              <a href="#" data-view="dashboard" class="active"
                ><span class="ic">📊</span
                ><span data-i18n="admin.nav.dashboard"></span
              ></a>
            </li>
            <li>
              <a href="#" data-view="news"
                ><span class="ic">📰</span
                ><span data-i18n="admin.nav.news"></span
              ></a>
            </li>
            <li>
              <a
                href="leadership.html"
                target="_blank"
                rel="noopener"
                data-external
                ><span class="ic">👥</span
                ><span data-i18n="admin.nav.leadership"></span
                ><span
                  style="
                    margin-inline-start: auto;
                    font-size: 11px;
                    opacity: 0.55;
                  "
                  >↗</span
                ></a
              >
            </li>
            <li>
              <a href="#" data-view="reports"
                ><span class="ic">📁</span
                ><span data-i18n="admin.nav.reports"></span
              ></a>
            </li>
            <li>
              <a href="#" data-view="donations"
                ><span class="ic">💰</span
                ><span data-i18n="admin.nav.donations"></span
              ></a>
            </li>
            <li>
              <a href="#" data-view="donors"
                ><span class="ic">👥</span
                ><span data-i18n="admin.nav.donors"></span
              ></a>
            </li>
            <li>
              <a href="#" data-view="messages"
                ><span class="ic">✉️</span
                ><span data-i18n="admin.nav.messages"></span
              ></a>
            </li>
            <li>
              <a href="#" data-view="users"
                ><span class="ic">🔐</span
                ><span data-i18n="admin.nav.users"></span
              ></a>
            </li>
            <li>
              <a href="#" data-view="settings"
                ><span class="ic">⚙️</span
                ><span data-i18n="admin.nav.settings"></span
              ></a>
            </li>
          </ul>

          <div class="sidebar-user">
            <div class="avatar">AD</div>
            <div class="info">
              <strong data-i18n="admin.user.name"></strong>
              <small data-i18n="admin.user.role"></small>
            </div>
            <button class="logout" id="logoutBtn" title="Logout">⎋</button>
          </div>
        </aside>

        <!-- ============ MAIN ============ -->
        <main class="admin-main" id="adminMain">
          <div class="admin-topbar">
            <div class="admin-topbar-left">
              <button
                class="admin-mobile-toggle"
                id="mobileMenuToggle"
                aria-label="Menu"
              >
                <span></span><span></span><span></span>
              </button>
              <div>
                <h1 id="viewTitle" data-i18n="admin.dashboard.title"></h1>
                <p id="viewSubtitle" data-i18n="admin.dashboard.welcome"></p>
              </div>
            </div>
            <div class="admin-topbar-right">
              <!-- 🌙 DASHBOARD THEME TOGGLE -->
              <button
                class="theme-toggle-btn"
                id="themeToggle"
                aria-label="Toggle dark mode"
                title="Dark mode"
              >
                🌙
              </button>

              <!-- 🌐 LANGUAGE SWITCHER (single globe) -->
              <div class="lang-switcher admin-lang" id="langSwitcherAdmin">
                <button
                  class="lang-btn"
                  id="langBtnAdmin"
                  aria-label="Change language"
                >
                  <span class="lang-current">AM</span>
                  <svg width="10" height="10" viewBox="0 0 10 10" fill="none">
                    <path
                      d="M1 3l4 4 4-4"
                      stroke="currentColor"
                      stroke-width="1.6"
                      stroke-linecap="round"
                    />
                  </svg>
                </button>
                <div class="lang-dropdown">
                  <button class="lang-option" data-lang="en">
                    <span class="lang-flag">🇬🇧</span> English
                  </button>
                  <button class="lang-option" data-lang="am">
                    <span class="lang-flag">🇪🇹</span> አማርኛ
                  </button>
                  <button class="lang-option" data-lang="om">
                    <span class="lang-flag">🌳</span> Oromoo
                  </button>
                  <button class="lang-option" data-lang="ar">
                    <span class="lang-flag">🇸🇦</span> العربية
                  </button>
                </div>
              </div>

              <button class="admin-btn" id="topExportBtn">
                📥 <span data-i18n="admin.actions.export"></span>
              </button>
              <button
                class="admin-btn primary"
                id="topAddBtn"
                style="display: none"
              ></button>
            </div>
          </div>

          <!-- ==================== DASHBOARD ==================== -->
          <div class="admin-view active" id="view-dashboard">
            <div class="dash-stats">
              <div class="dash-stat">
                <div class="ds-icon green">💰</div>
                <div class="ds-num">0<small> ብር</small></div>
                <div class="ds-lbl" data-i18n="admin.stat.raised"></div>
                <span class="ds-trend up">↑ 0%</span>
              </div>
              <div class="dash-stat">
                <div class="ds-icon gold">🎯</div>
                <div class="ds-num">0</div>
                <div class="ds-lbl" data-i18n="admin.stat.progress"></div>
                <span class="ds-trend up">↑ 0%</span>
              </div>
              <div class="dash-stat">
                <div class="ds-icon blue">👥</div>
                <div class="ds-num">0</div>
                <div class="ds-lbl" data-i18n="admin.stat.donors"></div>
                <span class="ds-trend up">↑ 0</span>
              </div>
              <div class="dash-stat">
                <div class="ds-icon purple">📰</div>
                <div class="ds-num">0</div>
                <div class="ds-lbl" data-i18n="admin.stat.news"></div>
                <span class="ds-trend up">↑ 0</span>
              </div>
            </div>

            <div class="admin-panel" style="margin-bottom: 24px">
              <div class="admin-panel-head">
                <h2 data-i18n="admin.dashboard.leadership.title"></h2>
                <a
                  href="leadership.html"
                  target="_blank"
                  rel="noopener"
                  data-i18n="admin.viewAll"
                ></a>
              </div>
              <div class="leadership-widget" id="leadershipWidget"></div>
            </div>

            <div class="admin-panel" style="margin-bottom: 24px">
              <div class="admin-panel-head">
                <h2 data-i18n="admin.dashboard.leadership.manage"></h2>
                <div style="display: flex; gap: 8px; flex-wrap: wrap">
                  <button class="admin-btn" data-ldr-add="top">
                    + <span data-i18n="admin.leadership.addTop"></span>
                  </button>
                  <button class="admin-btn primary" data-ldr-add="sector">
                    + <span data-i18n="admin.leadership.addSector"></span>
                  </button>
                </div>
              </div>
              <div id="leadershipManager"></div>
            </div>

            <div class="admin-cols">
              <div>
                <div class="admin-panel">
                  <div class="admin-panel-head">
                    <h2 data-i18n="admin.panel.recent"></h2>
                    <a
                      href="#"
                      data-goto="donations"
                      data-i18n="admin.viewAll"
                    ></a>
                  </div>
                  <div style="overflow-x: auto">
                    <table class="admin-table">
                      <thead>
                        <tr>
                          <th data-i18n="admin.tbl.donor"></th>
                          <th data-i18n="admin.tbl.amount"></th>
                          <th data-i18n="admin.tbl.method"></th>
                          <th data-i18n="admin.tbl.status"></th>
                        </tr>
                      </thead>
                      <tbody>
                        <tr>
                          <td
                            colspan="4"
                            style="
                              text-align: center;
                              color: var(--ink500);
                              padding: 30px;
                            "
                          >
                            Loading...
                          </td>
                        </tr>
                      </tbody>
                    </table>
                  </div>
                </div>
                <div class="admin-panel">
                  <div class="admin-panel-head">
                    <h2 data-i18n="admin.panel.reports"></h2>
                    <a
                      href="#"
                      data-goto="reports"
                      data-i18n="admin.viewAll"
                    ></a>
                  </div>
                  <div style="overflow-x: auto">
                    <table class="admin-table">
                      <thead>
                        <tr>
                          <th data-i18n="admin.tbl.report"></th>
                          <th data-i18n="admin.tbl.date"></th>
                          <th data-i18n="admin.tbl.status"></th>
                        </tr>
                      </thead>
                      <tbody>
                        <tr>
                          <td>Monthly Financial — Jan 2026</td>
                          <td>Feb 5, 2026</td>
                          <td>
                            <span
                              class="status-badge approved"
                              data-i18n="admin.status.published"
                            ></span>
                          </td>
                        </tr>
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
              <div>
                <div class="admin-panel">
                  <div class="admin-panel-head">
                    <h2 data-i18n="admin.panel.quick"></h2>
                  </div>
                  <div class="quick-actions">
                    <button class="quick-action" data-add="news">
                      <span class="qa-ic">📝</span
                      ><span class="qa-lbl" data-i18n="admin.quick.news"></span>
                    </button>
                    <button class="quick-action" data-add="reports">
                      <span class="qa-ic">📤</span
                      ><span
                        class="qa-lbl"
                        data-i18n="admin.quick.report"
                      ></span>
                    </button>
                    <button class="quick-action" data-add="donors">
                      <span class="qa-ic">👤</span
                      ><span
                        class="qa-lbl"
                        data-i18n="admin.quick.donor"
                      ></span>
                    </button>
                    <button class="quick-action" data-export>
                      <span class="qa-ic">📊</span
                      ><span
                        class="qa-lbl"
                        data-i18n="admin.quick.export"
                      ></span>
                    </button>
                  </div>
                </div>
                <div class="admin-panel">
                  <div class="admin-panel-head">
                    <h2 data-i18n="admin.panel.activity"></h2>
                  </div>
                  <ul class="activity-list">
                    <li class="activity-item">
                      <div class="av g">💰</div>
                      <div class="info">
                        <strong data-i18n="admin.act.a1"></strong
                        ><small data-i18n="admin.act.a1t"></small>
                      </div>
                    </li>
                    <li class="activity-item">
                      <div class="av b">📝</div>
                      <div class="info">
                        <strong data-i18n="admin.act.a2"></strong
                        ><small data-i18n="admin.act.a2t"></small>
                      </div>
                    </li>
                  </ul>
                </div>
              </div>
            </div>
          </div>

          <!-- ==================== NEWS ==================== -->
          <div class="admin-view" id="view-news">
            <div class="admin-panel">
              <div class="admin-panel-head">
                <h2 data-i18n="admin.news.list"></h2>
                <button class="admin-btn primary" data-add="news">
                  + <span data-i18n="admin.news.new"></span>
                </button>
              </div>
              <div style="overflow-x: auto">
                <table class="admin-table" data-table="news">
                  <thead>
                    <tr>
                      <th data-i18n="admin.news.th.title"></th>
                      <th data-i18n="admin.news.th.category"></th>
                      <th data-i18n="admin.tbl.date"></th>
                      <th data-i18n="admin.tbl.status"></th>
                      <th data-i18n="admin.tbl.actions"></th>
                    </tr>
                  </thead>
                  <tbody>
                    <tr>
                      <td
                        colspan="5"
                        style="
                          text-align: center;
                          color: var(--ink500);
                          padding: 30px;
                        "
                      >
                        Loading...
                      </td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>
          </div>

          <!-- ==================== REPORTS ==================== -->
          <div class="admin-view" id="view-reports">
            <div class="admin-panel">
              <div class="admin-panel-head">
                <h2 data-i18n="admin.reports.list"></h2>
                <button class="admin-btn primary" data-add="reports">
                  📤 <span data-i18n="admin.reports.upload"></span>
                </button>
              </div>
              <div style="overflow-x: auto">
                <table class="admin-table" data-table="reports">
                  <thead>
                    <tr>
                      <th data-i18n="admin.tbl.report"></th>
                      <th data-i18n="admin.reports.th.type"></th>
                      <th data-i18n="admin.tbl.date"></th>
                      <th data-i18n="admin.reports.th.size"></th>
                      <th data-i18n="admin.tbl.status"></th>
                      <th data-i18n="admin.tbl.actions"></th>
                    </tr>
                  </thead>
                  <tbody>
                    <tr>
                      <td
                        colspan="6"
                        style="
                          text-align: center;
                          color: var(--ink500);
                          padding: 30px;
                        "
                      >
                        Loading...
                      </td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>
          </div>

          <!-- ==================== DONATIONS ==================== -->
          <div class="admin-view" id="view-donations">
            <div class="admin-panel">
              <div class="admin-panel-head">
                <h2 data-i18n="admin.donations.list"></h2>
                <button class="admin-btn primary" data-add="donations">
                  + <span data-i18n="admin.donations.new"></span>
                </button>
              </div>
              <div style="overflow-x: auto">
                <table class="admin-table" data-table="donations">
                  <thead>
                    <tr>
                      <th data-i18n="admin.donations.th.id"></th>
                      <th data-i18n="admin.tbl.donor"></th>
                      <th data-i18n="admin.tbl.amount"></th>
                      <th data-i18n="admin.tbl.method"></th>
                      <th data-i18n="admin.tbl.date"></th>
                      <th data-i18n="admin.tbl.status"></th>
                      <th data-i18n="admin.tbl.actions"></th>
                    </tr>
                  </thead>
                  <tbody>
                    <tr>
                      <td
                        colspan="7"
                        style="
                          text-align: center;
                          color: var(--ink500);
                          padding: 30px;
                        "
                      >
                        Loading...
                      </td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>
          </div>

          <!-- ==================== DONORS ==================== -->
          <div class="admin-view" id="view-donors">
            <div class="admin-panel">
              <div class="admin-panel-head">
                <h2 data-i18n="admin.donors.list"></h2>
                <button class="admin-btn primary" data-add="donors">
                  + <span data-i18n="admin.donors.new"></span>
                </button>
              </div>
              <div style="overflow-x: auto">
                <table class="admin-table" data-table="donors">
                  <thead>
                    <tr>
                      <th data-i18n="admin.donors.th.name"></th>
                      <th data-i18n="admin.donors.th.phone"></th>
                      <th data-i18n="admin.donors.th.total"></th>
                      <th data-i18n="admin.donors.th.count"></th>
                      <th data-i18n="admin.donors.th.last"></th>
                      <th data-i18n="admin.tbl.actions"></th>
                    </tr>
                  </thead>
                  <tbody>
                    <tr>
                      <td
                        colspan="6"
                        style="
                          text-align: center;
                          color: var(--ink500);
                          padding: 30px;
                        "
                      >
                        Loading...
                      </td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>
          </div>

          <!-- ==================== MESSAGES ==================== -->
          <div class="admin-view" id="view-messages">
            <div class="admin-panel">
              <div class="admin-panel-head">
                <h2 data-i18n="admin.messages.inbox"></h2>
                <span
                  class="status-badge pending"
                  data-i18n="admin.messages.unread"
                ></span>
              </div>
            </div>
          </div>

          <!-- ==================== USERS ==================== -->
          <div class="admin-view" id="view-users">
            <div class="admin-panel">
              <div class="admin-panel-head">
                <h2 data-i18n="admin.users.list"></h2>
                <button class="admin-btn primary" data-add="users">
                  + <span data-i18n="admin.users.new"></span>
                </button>
              </div>
              <div style="overflow-x: auto">
                <table class="admin-table" data-table="users">
                  <thead>
                    <tr>
                      <th data-i18n="admin.users.th.user"></th>
                      <th data-i18n="admin.users.th.email"></th>
                      <th data-i18n="admin.users.th.role"></th>
                      <th data-i18n="admin.users.th.last"></th>
                      <th data-i18n="admin.tbl.status"></th>
                      <th data-i18n="admin.tbl.actions"></th>
                    </tr>
                  </thead>
                  <tbody>
                    <tr>
                      <td
                        colspan="6"
                        style="
                          text-align: center;
                          color: var(--ink500);
                          padding: 30px;
                        "
                      >
                        Loading...
                      </td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>
          </div>

          <!-- ==================== SETTINGS ==================== -->
          <div class="admin-view" id="view-settings">
            <div class="settings-section">
              <h3 data-i18n="admin.settings.general"></h3>
              <div class="settings-form">
                <div class="form-group">
                  <label
                    class="form-label"
                    data-i18n="admin.settings.projectName"
                  ></label
                  ><input
                    class="form-input"
                    type="text"
                    value="Malka Nono Project"
                  />
                </div>
                <div class="form-group">
                  <label
                    class="form-label"
                    data-i18n="admin.settings.orgName"
                  ></label
                  ><input
                    class="form-input"
                    type="text"
                    value="Malka Nono Islamic Affairs Council"
                  />
                </div>
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>

    <!-- ============ MODAL OVERLAY ============ -->
    <div class="modal-overlay" id="modalOverlay">
      <div class="modal" id="modalBox">
        <div class="modal-head">
          <h3 id="modalTitle">
            <span class="mh-icon">📝</span
            ><span id="modalTitleText">Title</span>
          </h3>
          <button class="modal-close" id="modalClose">×</button>
        </div>
        <div class="modal-body" id="modalBody"></div>
        <div class="modal-foot" id="modalFoot">
          <button
            class="modal-btn"
            id="modalCancel"
            data-i18n="admin.modal.cancel"
          ></button>
          <button
            class="modal-btn primary"
            id="modalSave"
            data-i18n="admin.modal.save"
          ></button>
        </div>
      </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <!-- ============ SCRIPTS ============ -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/translations.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/main.js"></script>
    <script src="js/supabase.js"></script>
